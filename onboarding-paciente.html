/* Entorno neutro: el foco es el celular. Barra fina arriba; recorridos y pantallas en paneles que se ocultan. */
:root {
  --bg: #E6E9F3; --panel: #FFFFFF; --hover: #F1F2F8; --fg: #151A2D; --muted: #64708A; --line: #DDE1EC;

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* Barra superior */
.bar { height: 52px; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar .sp { flex: 1; }
.lnk { font-size: 13px; color: var(--muted); text-decoration: none; }

.roles a.on { background: var(--panel); color: var(--sel); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tg { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); }
.tg:hover { color: var(--fg); }
.tg.ic { padding: 6px 9px; }
.unhide { position: fixed; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--muted); cursor: pointer; box-shadow: 0 4px 14px -6px rgba(21,26,45,.3); }
.unhide:hover { color: var(--fg); }
body.nobar .bar { display: none; }
body.nobar .app { height: 100%; }
.tg[aria-expanded="true"] { background: var(--sel); color: var(--sel-fg); border-color: var(--sel); }

.app { position: relative; height: calc(100% - 52px); }
.stage { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 4px; overflow: hidden; }

/* Paneles ocultables */
.rail { position: absolute; top: 8px; bottom: 12px; width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px !important; box-shadow: 0 10px 30px -12px rgba(21,26,45,.25); overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 20px; z-index: 10; transition: transform .2s ease; }
.rail-l { left: 12px; transform: translateX(calc(-100% - 24px)); }
.rail-r { right: 12px; transform: translateX(calc(100% + 24px)); }
.rail.open { transform: translateX(0); }
.rail-h { display: flex; align-items: center; justify-content: space-between; }
.sec-t { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.x { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; }

/* Recorridos */
.journeys { display: flex; flex-direction: column; gap: 4px; }
.jr { border-radius: 10px; }
.jr summary { list-style: none; cursor: pointer; padding: 8px 8px; border-radius: 8px; display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.jr summary::-webkit-details-marker { display: none; }
.jr summary:hover { background: var(--hover); }
.jr-n { font-size: 12px; color: var(--muted); font-weight: 400; flex-shrink: 0; }
.jr-d { font-size: 12px; color: var(--muted); margin: 0 8px 4px; }
.jr ol { list-style: none; margin: 0 0 6px; padding: 0 0 0 8px; counter-reset: st; }
.jr li button { counter-increment: st; width: 100%; display: flex; gap: 8px; text-align: left; background: none; border: 0; padding: 5px 6px; border-radius: 7px; cursor: pointer; font-size: 13px; line-height: 1.35; color: var(--muted); }
.jr li button::before { content: counter(st); flex-shrink: 0; width: 16px; text-align: right; font-size: 12px; }
.jr li button:hover { background: var(--hover); color: var(--fg); }
.jr li button.on { background: var(--sel-soft); color: var(--sel); font-weight: 600; }
.jr li button.done { color: var(--fg); }

/* Dispositivo */
.device-wrap { position: relative; width: 390px; height: 844px; transform-origin: top center; flex-shrink: 0; }
.device { position: absolute; inset: 0; border-radius: 54px; background: var(--device); padding: 14px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.35); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #F8FAFC; isolation: isolate; }
.screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; visibility: hidden; background: #F8FAFC; }
.screen iframe.on { visibility: visible; }
.notch { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: var(--device); border-radius: 20px; z-index: 5; pointer-events: none; }
.homebar { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; background: #0F172A; border-radius: 4px; opacity: .35; z-index: 5; pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: #64748B; font-size: 13px; z-index: 1; }
.toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(8px); background: #0F172A; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; z-index: 6; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: 300px; text-align: center; }

/* Pantallas */
.origin { font-size: 13px; }
.origin-mod { font-weight: 600; }
.origin-scr { margin-top: 2px; }
.origin-id, .sid { font-size: 11px; color: var(--muted); }
.origin-id { margin-left: 6px; }
.origin dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; }
.origin dt { color: var(--muted); }
.origin dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.origin .note { margin-top: 10px; font-size: 12.5px; line-height: 1.5; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.chip { font-size: 12px; color: var(--muted); }
.search { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 13px var(--f); }
.cat { display: flex; flex-direction: column; gap: 2px; }
.cat-g summary { list-style: none; cursor: pointer; padding: 7px 8px; border-radius: 8px; display: flex; gap: 8px; font-size: 13px; font-weight: 500; }
.cat-g summary::-webkit-details-marker { display: none; }
.cat-g summary:hover { background: var(--hover); }
.cat-g summary .chip { display: none; }
.cat-g summary .t { flex: 1; min-width: 0; }
.cat-g summary .n { font-size: 12px; color: var(--muted); font-weight: 400; }
.cat-g ul { list-style: none; margin: 0 0 6px; padding: 0 0 0 8px; }
.cat-g li button { width: 100%; text-align: left; background: none; border: 0; padding: 5px 6px; border-radius: 7px; cursor: pointer; font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; color: var(--muted); }
.cat-g li button:hover { background: var(--hover); color: var(--fg); }
.cat-g li button.on { background: var(--sel-soft); color: var(--sel); font-weight: 600; }
.cat-g li button.on .sid { color: inherit; opacity: .7; }
.cat-g li .sid { flex-shrink: 0; min-width: 52px; }
.only-m { display: none !important; }

/* Celular: el prototipo ocupa toda la pantalla; un solo botón abre el panel. */
@media (max-width: 700px) {
  .bar { display: none; }
  .app { height: 100%; }
  .stage { position: fixed; inset: 0; padding: 0; }
  .device-wrap { width: 100% !important; height: 100% !important; transform: none !important; }
  .device { border-radius: 0; padding: 0; box-shadow: none; }
  .screen { border-radius: 0; }
  .notch, .homebar, .rail-l { display: none; }
  .only-m { display: flex !important; }
  .rail-r { position: fixed; top: auto; left: 0; right: 0; width: auto; max-height: 80vh; border-radius: 16px 16px 0 0; border: 0; transform: translateY(105%); box-shadow: 0 -10px 30px rgba(0,0,0,.2); padding-bottom: max(22px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .rail-r.open { transform: translateY(0); }
  .fab-panel { position: fixed; z-index: 21; right: max(10px, env(safe-area-inset-right, 0px)); top: max(10px, env(safe-area-inset-top, 0px)); background: var(--fg); color: var(--bg); border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; opacity: .85; cursor: pointer; }
}
@media (min-width: 701px) { .fab-panel { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/><\/svg>' + '<\/span><div class=\"tx\"><b>Todavía no tenés profesionales<\/b><span>Cuando un profesional te invite, aparece acá.<\/span><\/div><\/div>';\n};\n\n/* Cobertura */\nENTER['cob-buscar'] = function () {\n  later(function () { g(ST.puco === 'none' ? 'cob-nada' : (ST.puco === 'down' ? 'cob-down' : 'cob-encontrada')); }, 1800);\n};\nENTER['cob-encontrada'] = function () { $('c-plan').value = ''; $('c-num').value = ''; validCob(); };\nfunction validCob() { var ok = $('c-num').value.replace(/\\D/g, '').length >= 6; $('cobBtn').classList.toggle('dis', !ok); return ok; }\nfunction fillCob() { $('c-plan').value = '210'; $('c-num').value = '0923979835268'; validCob(); }\nENTER['cob-manual'] = function () { $('cm-cob').value = ''; $('cm-plan').value = ''; $('cm-num').value = ''; validCobM(); };\nfunction validCobM() { var ok = $('cm-cob').value && $('cm-num').value.replace(/\\D/g, '').length >= 6; $('cobMBtn').classList.toggle('dis', !ok); return !!ok; }\nfunction fillCobM() { $('cm-cob').value = 'OSDE'; $('cm-plan').value = '210'; $('cm-num').value = '0923979835268'; validCobM(); }\nfunction guardarCob(cob, src) {\n  var pre = src === 'puco' ? 'c-' : 'cm-';\n  if (src === 'puco' ? !validCob() : !validCobM()) return;\n  ST.cob = { cob: cob, plan: $(pre + 'plan').value.trim(), num: $(pre + 'num').value.trim(), src: src };\n  g('cob-ok');\n}\nENTER['cob-ok'] = function () {\n  var c = ST.cob || { cob: 'OSDE', plan: '210', num: '0923979835268' };\n  $('cobOkTxt').innerHTML = c.cob + (c.plan ? ' ' + c.plan : '') + ' · Nº ' + c.num + '<br/>Ya la podés usar en turnos, recetas y órdenes.';\n};\nfunction particular() { ST.cob = { part: true }; g('pac-home'); toast('Listo. Te atendés como particular.'); }\n\narrancar();\n<\/script>\n<script>\n/* iurumi · puente módulo ↔ shell. Lo inyecta src/build.js al final de cada módulo\n   (el build completa el id del módulo, su configuración y la función que muestra una pantalla). */\n(function () {\n  var MOD = \"alta\";\n  var CFG = {\"screenSel\":\".s.active\",\"screenAttr\":\"data-screen\",\"screenRoot\":\".s\",\"navSel\":null,\"navItems\":null,\"area\":null,\"areaByScreen\":null};\n  var SHOW = function (S, ARG) { if (ARG && ARG.mas) Object.assign(ST, ARG.mas); else if (ARG) reset(ARG); g(S); if (ARG && ARG.fn) window[ARG.fn](); };\n\n  function send(m) {\n    m.iu = 1; m.mod = MOD;\n    try { parent.postMessage(m, '*'); } catch (e) {}\n  }\n\n  var IU = window.IU = {\n    mod: MOD,\n    state: {},\n    on: {},\n    /* Navega a otro módulo (o a otra pantalla de este). */\n    go: function (mod, scr, arg) { send({ t: 'go', to: mod, scr: scr || null, arg: arg === undefined ? null : arg }); },\n    /* Vuelve a la pantalla anterior del recorrido (aunque sea de otro módulo). */\n    back: function () { send({ t: 'back' }); },\n    /* Abre el otro rol (paciente.html ↔ profesional.html) en una pantalla. */\n    rol: function (rol, mod, scr) { send({ t: 'rol', rol: rol, to: mod, scr: scr || null }); },\n    /* Estado compartido de la demo entre módulos (p. ej. turno reservado). */\n    set: function (k, v) { IU.state[k] = v; send({ t: 'set', k: k, v: v }); },\n    toast: function (msg) {\n      var fn = window.showToast || window.toast;\n      if (typeof fn === 'function') { try { fn(msg); return; } catch (e) {} }\n      send({ t: 'toast', msg: msg });\n    },\n    /* Confirmación de acciones que eliminan algo: hoja inferior igual en todos los módulos.\n       o = { titulo, texto, accion ('Sí, eliminar' por defecto), ok: función } */\n    confirmar: function (o) {\n      var ov = document.getElementById('iuConf');\n      if (!ov) {\n        document.body.insertAdjacentHTML('beforeend', '<div class=\"iu-conf\" id=\"iuConf\"><div class=\"iu-conf-sh\" role=\"dialog\" aria-modal=\"true\">' +\n          '<div class=\"iu-conf-h\"><\/div><div class=\"iu-conf-ic\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18\"/><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\"/><path d=\"M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/><\/svg><\/div>' +\n          '<h3 id=\"iuConfT\"><\/h3><p id=\"iuConfP\"><\/p><button class=\"iu-conf-ok\" id=\"iuConfOk\"><\/button><button class=\"iu-conf-no\" id=\"iuConfNo\">Cancelar<\/button><\/div><\/div>');\n        ov = document.getElementById('iuConf');\n        ov.addEventListener('click', function (e) { if (e.target === ov) ov.classList.remove('on'); });\n        document.getElementById('iuConfNo').onclick = function () { ov.classList.remove('on'); };\n      }\n      document.getElementById('iuConfT').textContent = o.titulo;\n      document.getElementById('iuConfP').innerHTML = o.texto || '';\n      var b = document.getElementById('iuConfOk');\n      b.textContent = o.accion || 'Sí, eliminar';\n      b.onclick = function () { ov.classList.remove('on'); if (o.ok) o.ok(); };\n      ov.classList.add('on');\n    }\n  };\n\n  /* Pantalla activa del módulo. */\n  function cur() {\n    var el = null, list = document.querySelectorAll(CFG.screenSel || '.s.active');\n    for (var i = 0; i < list.length; i++) {\n      if (list[i].offsetParent !== null || getComputedStyle(list[i]).display !== 'none') { el = list[i]; break; }\n    }\n    if (!el) return null;\n    return el.getAttribute(CFG.screenAttr || 'data-screen') || el.id || null;\n  }\n\n  /* ¿La pantalla activa muestra la nav inferior? */\n  function navVisible() {\n    if (!CFG.navSel) return false;\n    var navs = document.querySelectorAll(CFG.navSel);\n    for (var i = 0; i < navs.length; i++) {\n      var r = navs[i].getBoundingClientRect();\n      if (r.width > 0 && r.height > 0 && getComputedStyle(navs[i]).visibility !== 'hidden') return true;\n    }\n    return false;\n  }\n\n  /* Nav inferior unificada del rol: reemplaza el contenido de las navs del módulo\n     y marca el ítem activo según la pantalla (la del contenedor o, si la nav es global, la activa). */\n  function areaFor(scr) {\n    return (CFG.areaByScreen && scr && CFG.areaByScreen[scr]) || CFG.area;\n  }\n  function renderNav() {\n    if (!CFG.navSel || !CFG.navItems) return;\n    var navs = document.querySelectorAll(CFG.navSel);\n    var now = cur();\n    for (var i = 0; i < navs.length; i++) {\n      var nav = navs[i];\n      if (!nav.getAttribute('data-iu-nav')) {\n        var html = '';\n        for (var k = 0; k < CFG.navItems.length; k++) {\n          var it = CFG.navItems[k];\n          html += '<button type=\"button\" class=\"iu-bni\" data-iu-to=\"' + it.id + '\">' +\n            it.icon + '<span>' + it.label + '<\/span>' + (it.badge ? '<i class=\"iu-badge\">' + it.badge + '<\/i>' : '') + '<\/button>';\n        }\n        nav.innerHTML = html;\n        nav.classList.add('iu-bn');\n        nav.setAttribute('data-iu-nav', '1');\n      }\n      var host = nav.closest(CFG.screenRoot || '.s');\n      var scr = host ? (host.getAttribute(CFG.screenAttr || 'data-screen') || host.id) : now;\n      var area = areaFor(scr);\n      var bs = nav.querySelectorAll('.iu-bni');\n      for (var j = 0; j < bs.length; j++) bs[j].classList.toggle('act', bs[j].getAttribute('data-iu-to') === area);\n    }\n  }\n\n  document.addEventListener('click', function (e) {\n    var b = e.target.closest && e.target.closest('[data-iu-to]');\n    if (!b) return;\n    e.preventDefault(); e.stopPropagation();\n    send({ t: 'nav', area: b.getAttribute('data-iu-to') });\n  }, true);\n\n  /* Ningún alert/confirm nativo: en el visor no se muestran. */\n  window.alert = function (m) { IU.toast(String(m)); };\n\n  var last = null;\n  function report(force) {\n    var s = cur();\n    if (s && (force || s !== last)) { last = s; send({ t: 'screen', scr: s, nav: navVisible() }); }\n  }\n\n  window.addEventListener('message', function (e) {\n    var d = e.data;\n    if (!d || !d.iu || d.from !== 'shell') return;\n    if (d.state) IU.state = d.state;\n    if (d.t === 'show') {\n      try {\n        if (d.state && typeof IU.on.state === 'function') IU.on.state(IU.state);\n        if (d.scr) SHOW(d.scr, d.arg);\n        if (d.arg !== null && d.arg !== undefined && typeof IU.on.arg === 'function') IU.on.arg(d.arg, d.scr);\n      } catch (err) { console.error('[iurumi] show', d.scr, err); }\n      renderNav();\n      report(true);\n    } else if (d.t === 'state') {\n      if (typeof IU.on.state === 'function') IU.on.state(IU.state);\n    }\n  });\n\n  var pending = 0;\n  new MutationObserver(function () {\n    clearTimeout(pending);\n    pending = setTimeout(function () { renderNav(); report(false); }, 40);\n  }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'style'] });\n\n  renderNav();\n  send({ t: 'ready', scr: cur() });\n})();\n\n<\/script>\n<script>\n\n\n<\/script>\n<\/body>\n<\/html>\n"}},"orden":["alta"],"recorridos":[{"titulo":"Camino ideal y cobertura","desc":"Con correo; después, la cobertura desde PUCO.","pasos":[{"mod":"alta","scr":"welcome","txt":"Bienvenida","arg":{}},{"mod":"alta","scr":"signup","txt":"Crear cuenta y aceptar términos"},{"mod":"alta","scr":"signup-code","txt":"Código al correo"},{"mod":"alta","scr":"signup-password","txt":"Contraseña"},{"mod":"alta","scr":"role","txt":"Elegir rol: paciente"},{"mod":"alta","scr":"id-intro","txt":"Último paso: identidad con Didit"},{"mod":"alta","scr":"cam-perm","txt":"Permiso de cámara"},{"mod":"alta","scr":"dd-front","txt":"Frente del DNI"},{"mod":"alta","scr":"dd-back","txt":"Dorso del DNI"},{"mod":"alta","scr":"dd-selfie","txt":"Selfie con prueba de vida"},{"mod":"alta","scr":"dd-proc","txt":"Didit verifica"},{"mod":"alta","scr":"wb-pac","txt":"Listo: datos del DNI y celular opcional","arg":{"mas":{"idState":"ok"}}},{"mod":"alta","scr":"pac-home","txt":"Primera tarea: la cobertura"},{"mod":"alta" <script>
(function () {
  'use strict';
  var D = window.IU_DATA;
  var $ = function (id) { return document.getElementById(id); };
  var screenEl = $('screen');
  var frames = {};
  var cur = { mod: null, scr: null };
  var hist = [];
  var state = {};
  var trail = [];   /* pantallas visitadas, para marcar pasos hechos */

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------- Módulos (iframes aislados) ---------- */
  function frame(id) {
    if (frames[id]) return frames[id];
    var m = D.modulos[id];
    var el = document.createElement('iframe');
    el.title = m.nombre;
    el.setAttribute('data-mod', id);
    el.srcdoc = m.html;
    screenEl.insertBefore(el, $('toast'));
    frames[id] = { el: el, ready: false, queue: [], scr: null, visited: false };
    return frames[id];
  }
  function post(id, msg) {
    var f = frame(id);
    msg.iu = 1; msg.from = 'shell'; msg.state = state;
    if (!f.ready) { f.queue.push(msg); return; }
    f.el.contentWindow.postMessage(msg, '*');
  }
  function showFrame(id) {
    for (var k in frames) frames[k].el.classList.toggle('on', k === id);
  }

  function go(mod, scr, arg, opt) {
    opt = opt || {};
    if (!D.modulos[mod]) { toast('Esa pantalla no está en este prototipo'); return; }
    if (opt.push !== false && cur.mod && !(cur.mod === mod && cur.scr === scr)) hist.push({ mod: cur.mod, scr: cur.scr });
    if (hist.length > 60) hist.shift();
    var f = frame(mod);
    var target = scr || (f.visited ? null : D.modulos[mod].inicio);
    showFrame(mod);
    cur.mod = mod;
    cur.scr = target || f.scr || D.modulos[mod].inicio;
    f.visited = true;
    post(mod, { t: 'show', scr: target, arg: arg === undefined ? null : arg });
    sync();
  }
  function back() {
    var p = hist.pop();
    if (p) go(p.mod, p.scr, null, { push: false });
  }
  function navTo(area) {
    var it = null;
    for (var i = 0; i < D.nav.length; i++) if (D.nav[i].id === area) it = D.nav[i];
    if (!it) return;
    if (it.disponible === false) { toast(it.aviso || 'Próximamente'); return; }
    hist = [];
    go(it.mod, it.scr, null, { push: false });
  }
  function broadcast() {
    for (var k in frames) if (frames[k].ready) post(k, { t: 'state' });
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.iu || d.from === 'shell') return;
    var id = null;
    for (var k in frames) if (frames[k].el.contentWindow === e.source) id = k;
    if (!id) return;
    var f = frames[id];
    switch (d.t) {
      case 'ready':
        f.ready = true;
        if (d.scr && !f.scr) f.scr = d.scr;
        f.queue.splice(0).forEach(function (m) { f.el.contentWindow.postMessage(m, '*'); });
        $('loading').hidden = true;
        break;
      case 'screen':
        f.scr = d.scr;
        if (id === cur.mod) { cur.scr = d.scr; sync(); }
        break;
      case 'go': go(d.to || id, d.scr, d.arg); break;
      case 'back': back(); break;
      case 'nav': navTo(d.area); break;
      case 'set': state[d.k] = d.v; broadcast(); break;
      case 'toast': toast(d.msg); break;
      case 'rol':
        if (/^[a-z-]+$/.test(d.rol || '')) {
          location.href = d.rol + '.html' + (d.to ? '#' + d.to + (d.scr ? '~' + d.scr : '') : '');
        }
        break;
    }
  });

  var tt = 0;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ---------- Panel ---------- */
  function scrInfo(mod, scr) {
    var m = D.modulos[mod]; if (!m) return null;
    for (var i = 0; i < m.pantallas.length; i++) if (m.pantallas[i].id === scr) return m.pantallas[i];
    return null;
  }
  function renderOrigin() {
    var m = D.modulos[cur.mod]; if (!m) return;
    var s = scrInfo(cur.mod, cur.scr) || { id: cur.scr, label: cur.scr };
    var chips = '<span class="chip">' + esc(m.bloque) + '</span>';
    var html = '<div class="origin-mod">' + esc(m.nombre) + '</div>' +
      '<div class="origin-scr">' + esc(s.label) + '<span class="origin-id">' + esc(s.id) + '</span></div>' +
      '<dl><dt>Bloque</dt><dd>' + chips + '</dd><dt>Fuente</dt><dd>' + esc(m.fuente) + '</dd>' +
      '</dl>';
    var note = s.nota || m.nota;
    if (note) html += '<div class="note">' + esc(note) + '</div>';
    $('origin').innerHTML = html;
  }
  function renderCatalog() {
    var q = ($('q').value || '').trim().toLowerCase();
    var html = '';
    D.orden.forEach(function (id) {
      var m = D.modulos[id];
      var items = m.pantallas.filter(function (p) {
        return !q || (p.label + ' ' + p.id + ' ' + m.nombre).toLowerCase().indexOf(q) >= 0;
      });
      if (!items.length) return;
      var open = q || id === cur.mod;
      html += '<details class="cat-g"' + (open ? ' open' : '') + '><summary><span class="chip">' + esc(m.bloque) + '</span><span class="t">' + esc(m.nombre) + '</span><span class="n">' + items.length + '</span></summary><ul>';
      items.forEach(function (p) {
        var on = id === cur.mod && p.id === cur.scr;
        html += '<li><button type="button" class="' + (on ? 'on' : '') + '" data-go="' + esc(id) + '~' + esc(p.id) + '"><span class="sid">' + esc(p.id) + '</span><span>' + esc(p.label) + '</span></button></li>';
      });
      html += '</ul></details>';
    });
    $('cat').innerHTML = html || '<p style="color:var(--muted);font-size:13px">Ninguna pantalla coincide.</p>';
  }
  function renderJourneys() {
    var html = '';
    D.recorridos.forEach(function (r, ri) {
      var abierto = r.pasos.some(function (p) { return p.mod === cur.mod && p.scr === cur.scr; });
      html += '<details class="jr"' + (abierto ? ' open' : '') + '><summary>' + esc(r.titulo) + '<span class="jr-n">' + r.pasos.length + '</span></summary>' +
        (r.desc ? '<div class="jr-d">' + esc(r.desc) + '</div>' : '') + '<ol>';
      r.pasos.forEach(function (p, pi) {
        var on = p.mod === cur.mod && p.scr === cur.scr;
        var done = !on && trail.indexOf(p.mod + '~' + p.scr) >= 0;
        html += '<li><button type="button" class="' + (on ? 'on' : done ? 'done' : '') + '" data-step="' + ri + '.' + pi + '">' + esc(p.txt) + '</button></li>';
      });
      html += '</ol></details>';
    });
    $('jrL').innerHTML = html; $('jrR').innerHTML = html;
  }
  function sync() {
    if (!cur.mod) return;
    var key = cur.mod + '~' + cur.scr;
    if (trail[trail.length - 1] !== key) trail.push(key);
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
    renderOrigin(); renderCatalog(); renderJourneys();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b) { var p = b.getAttribute('data-go').split('~'); hist = []; go(p[0], p[1], null, { push: false }); closePanel(); return; }
    var s = e.target.closest('[data-step]');
    if (s) {
      var ix = s.getAttribute('data-step').split('.');
      var st = D.recorridos[+ix[0]].pasos[+ix[1]];
      go(st.mod, st.scr, st.arg); closePanel();
    }
  });
  $('q').addEventListener('input', renderCatalog);

  /* Paneles ocultables (se recuerda cuáles dejaste abiertos). En celular, el panel se cierra al elegir. */
  var movil = function () { return window.innerWidth <= 700; };
  function setPanel(k, on) {
    $('rail' + k).classList.toggle('open', on);
    $('tg' + k).setAttribute('aria-expanded', on ? 'true' : 'false');
    if (k === 'R') $('fabPanel').setAttribute('aria-expanded', on ? 'true' : 'false');
    if (!movil()) try { localStorage.setItem('iu-panel-' + k, on ? '1' : '0'); } catch (e) {}
  }
  function closePanel() { if (movil()) setPanel('R', false); }
  ['L', 'R'].forEach(function (k) {
    $('tg' + k).addEventListener('click', function () { setPanel(k, !$('rail' + k).classList.contains('open')); });
    var v = null; try { v = localStorage.getItem('iu-panel-' + k); } catch (e) {}
    if (!movil()) setPanel(k, v === '1');
  });
  document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { setPanel(b.getAttribute('data-close'), false); }); });
  $('fabPanel').addEventListener('click', function () { setPanel('R', !$('railR').classList.contains('open')); });
  /* Modo foco: oculta barra y paneles; «Mostrar menús» (o la tecla H) los vuelve a traer. */
  function setBar(on) {
    document.body.classList.toggle('nobar', !on); $('unhide').hidden = on;
    if (!on) { setPanel('L', false); setPanel('R', false); }
    try { localStorage.setItem('iu-bar', on ? '1' : '0'); } catch (e) {}
    fit();
  }
  $('hideBar').addEventListener('click', function () { setBar(false); });
  $('unhide').addEventListener('click', function () { setBar(true); });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'h' || e.key === 'H') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) setBar(document.body.classList.contains('nobar'));
  });

  /* El dispositivo se achica si la ventana es más baja que el teléfono. */
  function fit() {
    var w = $('deviceWrap');
    if (window.innerWidth <= 700) { w.style.transform = ''; w.style.marginBottom = ''; return; }
    var st = $('stage');
    var k = Math.min(1, (window.innerHeight - (document.body.classList.contains('nobar') ? 0 : 52) - 20) / 844, (st.clientWidth - 24) / 390);
    w.style.transform = 'scale(' + k + ')';
    w.style.marginBottom = (844 * k - 844) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  try { if (localStorage.getItem('iu-bar') === '0' && !movil()) setBar(false); } catch (e) {}

  /* Arranque: deep link #modulo~pantalla o pantalla inicial del rol. */
  /* También #r3: arranca el recorrido 3 (lo usan los enlaces de la portada). */
  var h = (location.hash || '').replace(/^#/, '').split('~');
  var rj = /^r(\d+)$/.exec(h[0]), r0 = rj && D.recorridos[+rj[1]] && D.recorridos[+rj[1]].pasos[0];
  if (r0) go(r0.mod, r0.scr, r0.arg, { push: false });
  else if (h[0] && D.modulos[h[0]]) go(h[0], h[1] || null, null, { push: false });
  else go(D.inicio.mod, D.inicio.scr, null, { push: false });
  window.IU_SHELL = { go: go, back: back, frames: frames, cur: cur, state: state };
})();
</script>
</body>
</html>
