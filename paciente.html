<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iurumí Paciente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<meta name="robots" content="noindex, nofollow">
<style>
/* Entorno neutro: el foco es el celular. Barra fina arriba; recorridos y pantallas en paneles que se ocultan. */
:root {
  --bg: #E6E9F3; --panel: #FFFFFF; --hover: #F1F2F8; --fg: #151A2D; --muted: #64708A; --line: #DDE1EC;
  --sel: #6366F1; --sel-fg: #FFFFFF; --sel-soft: #EEF0FF; --device: #151A2D;
  --f: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* Barra superior */
.bar { height: 52px; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar .sp { flex: 1; }
.lnk { font-size: 13px; color: var(--muted); text-decoration: none; }
.lnk:hover { color: var(--fg); }
.roles { display: flex; gap: 2px; background: rgba(255,255,255,.5); border-radius: 9px; padding: 3px; }
.roles a { padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; }
.roles a.on { background: var(--panel); color: var(--sel); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tg { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); }
.tg:hover { color: var(--fg); }
.tg.ic { padding: 6px 9px; }
.unhide { position: fixed; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--muted); cursor: pointer; box-shadow: 0 4px 14px -6px rgba(21,26,45,.3); }
.unhide:hover { color: var(--fg); }
body.nobar .bar { display: none; }
body.nobar .app { height: 100%; }
.tg[aria-expanded="true"] { background: var(--sel); color: var(--sel-fg); border-color: var(--sel); }

.app { position: relative; height: calc(100% - 52px); }
.stage { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 4px; overflow: hidden; }

/* Paneles ocultables */
.rail { position: absolute; top: 8px; bottom: 12px; width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px !important; box-shadow: 0 10px 30px -12px rgba(21,26,45,.25); overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 20px; z-index: 10; transition: transform .2s ease; }
.rail-l { left: 12px; transform: translateX(calc(-100% - 24px)); }
.rail-r { right: 12px; transform: translateX(calc(100% + 24px)); }
.rail.open { transform: translateX(0); }
.rail-h { display: flex; align-items: center; justify-content: space-between; }
.sec-t { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.x { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; }

/* Recorridos */
.journeys { display: flex; flex-direction: column; gap: 4px; }
.jr { border-radius: 10px; }
.jr summary { list-style: none; cursor: pointer; padding: 8px 8px; border-radius: 8px; display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.jr summary::-webkit-details-marker { display: none; }
.jr summary:hover { background: var(--hover); }
.jr-n { font-size: 12px; color: var(--muted); font-weight: 400; flex-shrink: 0; }
.jr-d { font-size: 12px; color: var(--muted); margin: 0 8px 4px; }
.jr ol { list-style: none; margin: 0 0 6px; padding: 0 0 0 8px; counter-reset: st; }
.jr li button { counter-increment: st; width: 100%; display: flex; gap: 8px; text-align: left; background: none; border: 0; padding: 5px 6px; border-radius: 7px; cursor: pointer; font-size: 13px; line-height: 1.35; color: var(--muted); }
.jr li button::before { content: counter(st); flex-shrink: 0; width: 16px; text-align: right; font-size: 12px; }
.jr li button:hover { background: var(--hover); color: var(--fg); }
.jr li button.on { background: var(--sel-soft); color: var(--sel); font-weight: 600; }
.jr li button.done { color: var(--fg); }

/* Dispositivo */
.device-wrap { position: relative; width: 390px; height: 844px; transform-origin: top center; flex-shrink: 0; }
.device { position: absolute; inset: 0; border-radius: 54px; background: var(--device); padding: 14px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.35); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #F8FAFC; isolation: isolate; }
.screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; visibility: hidden; background: #F8FAFC; }
.screen iframe.on { visibility: visible; }
.notch { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: var(--device); border-radius: 20px; z-index: 5; pointer-events: none; }
.homebar { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; background: #0F172A; border-radius: 4px; opacity: .35; z-index: 5; pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: #64748B; font-size: 13px; z-index: 1; }
.toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(8px); background: #0F172A; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; z-index: 6; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: 300px; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Pantallas */
.origin { font-size: 13px; }
.origin-mod { font-weight: 600; }
.origin-scr { margin-top: 2px; }
.origin-id, .sid { font-size: 11px; color: var(--muted); }
.origin-id { margin-left: 6px; }
.origin dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; }
.origin dt { color: var(--muted); }
.origin dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.origin .note { margin-top: 10px; font-size: 12.5px; line-height: 1.5; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.chip { font-size: 12px; color: var(--muted); }
.search { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 13px var(--f); }
.cat { display: flex; flex-direction: column; gap: 2px; }
.cat-g summary { list-style: none; cursor: pointer; padding: 7px 8px; border-radius: 8px; display: flex; gap: 8px; font-size: 13px; font-weight: 500; }
.cat-g summary::-webkit-details-marker { display: none; }
.cat-g summary:hover { background: var(--hover); }
.cat-g summary .chip { display: none; }
.cat-g summary .t { flex: 1; min-width: 0; }
.cat-g summary .n { font-size: 12px; color: var(--muted); font-weight: 400; }
.cat-g ul { list-style: none; margin: 0 0 6px; padding: 0 0 0 8px; }
.cat-g li button { width: 100%; text-align: left; background: none; border: 0; padding: 5px 6px; border-radius: 7px; cursor: pointer; font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; color: var(--muted); }
.cat-g li button:hover { background: var(--hover); color: var(--fg); }
.cat-g li button.on { background: var(--sel-soft); color: var(--sel); font-weight: 600; }
.cat-g li button.on .sid { color: inherit; opacity: .7; }
.cat-g li .sid { flex-shrink: 0; min-width: 52px; }
.only-m { display: none !important; }

/* Celular: el prototipo ocupa toda la pantalla; un solo botón abre el panel. */
@media (max-width: 700px) {
  .bar { display: none; }
  .app { height: 100%; }
  .stage { position: fixed; inset: 0; padding: 0; }
  .device-wrap { width: 100% !important; height: 100% !important; transform: none !important; }
  .device { border-radius: 0; padding: 0; box-shadow: none; }
  .screen { border-radius: 0; }
  .notch, .homebar, .rail-l { display: none; }
  .only-m { display: flex !important; }
  .rail-r { position: fixed; top: auto; left: 0; right: 0; width: auto; max-height: 80vh; border-radius: 16px 16px 0 0; border: 0; transform: translateY(105%); box-shadow: 0 -10px 30px rgba(0,0,0,.2); padding-bottom: max(22px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .rail-r.open { transform: translateY(0); }
  .fab-panel { position: fixed; z-index: 21; right: max(10px, env(safe-area-inset-right, 0px)); top: max(10px, env(safe-area-inset-top, 0px)); background: var(--fg); color: var(--bg); border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; opacity: .85; cursor: pointer; }
}
@media (min-width: 701px) { .fab-panel { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

════════ */\nfunction openQR(g, back){ CTX.qrG = g; CTX.qrBack = back || CUR.PRO; go('PRO','p-qr'); }\nfunction qrBack(){ go('PRO', CTX.qrBack || 'p-home'); }\nfunction qrSVG(seed){\n  var n = 25, cell = 8, s = seed || 7, bits = [];\n  function rnd(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }\n  function finder(x, y){ for(var i=0;i<7;i++) for(var j=0;j<7;j++){ var on = (i===0||i===6||j===0||j===6) || (i>=2&&i<=4&&j>=2&&j<=4); bits.push([x+i, y+j, on]); } }\n  var inF = function(x,y){ return (x<8&&y<8) || (x>n-9&&y<8) || (x<8&&y>n-9); };\n  var r = '';\n  for(var y=0;y<n;y++) for(var x=0;x<n;x++){ if(inF(x,y)) continue; if(rnd() > .52) r += '<rect x=\"'+x*cell+'\" y=\"'+y*cell+'\" width=\"'+cell+'\" height=\"'+cell+'\"/>'; }\n  bits = []; finder(0,0); finder(n-7,0); finder(0,n-7);\n  bits.forEach(function(b){ if(b[2]) r += '<rect x=\"'+b[0]*cell+'\" y=\"'+b[1]*cell+'\" width=\"'+cell+'\" height=\"'+cell+'\"/>'; });\n  return '<svg width=\"200\" height=\"200\" viewBox=\"0 0 '+n*cell+' '+n*cell+'\" fill=\"#0F172A\" shape-rendering=\"crispEdges\">'+r+'<\/svg>';\n}\nRENDER['p-qr'] = function(){\n  var g = CTX.qrG; var cs = S.cargos.filter(function(c){ return c.g===g && c.estado!=='anu' && c.estado!=='bon'; });\n  if(!cs.length){ el('pQR').innerHTML = '<div class=\"emptyline\" style=\"margin-top:30px;\">No hay un cobro seleccionado<\/div>'; el('pQRff').innerHTML=''; return; }\n  var p = PAC[cs[0].pac], paid = cs.every(function(c){ return c.estado==='pag'; });\n  if(paid){\n    var pg = pago(cs[0].pago);\n    el('pQR').innerHTML = '<div class=\"okhero\" style=\"padding-top:40px;\"><div class=\"okc\">'+svg('check',36,2.6)+'<\/div><h2>Pago recibido<\/h2><div class=\"money-big\" style=\"margin-top:8px;\">'+money(sum(cs))+'<\/div>'+\n      '<p>'+p.short+' pagó con '+MEDIO[pg.medio]+(pg.medio==='mp'?'. Se acreditó en tu cuenta de Mercado Pago.':'.')+'<\/p><\/div>'+\n      '<div class=\"card\" style=\"margin-top:16px;\">'+cs.map(function(c){ return '<div class=\"cl\"><div class=\"cc\">'+c.concepto+'<\/div><div class=\"cm\">'+money(c.monto)+'<\/div><\/div>'; }).join('')+'<\/div>';\n    el('pQRff').innerHTML = '<button class=\"btn\" onclick=\"qrBack()\">Listo<\/button>';\n    return;\n  }\n  el('pQR').innerHTML = '<div class=\"qrwrap\"><div class=\"ln\">Cobro a<\/div><div style=\"font-size:17px;font-weight:800;margin-top:2px;\">'+p.short+'<\/div>'+\n    '<div class=\"money-big\" style=\"margin-top:6px;\">'+money(sum(cs.filter(function(c){ return c.estado==='pend'; })))+'<\/div>'+\n    '<div class=\"qrbox\">'+qrSVG(g.length*37 + sum(cs))+'<\/div>'+\n    '<div class=\"ln\" style=\"margin-bottom:12px;\">'+cs.map(function(c){ return c.concepto+' '+money(c.monto); }).join(' · ')+'<\/div>'+\n    '<span class=\"waiting\">Esperando pago<\/span><\/div>'+\n    '<div class=\"note grey\" style=\"margin-top:16px;\">'+svg('info',15)+'<div>'+p.first+' escanea el código con la cámara o con la app de Mercado Pago. Esta pantalla se actualiza sola cuando se acredita.<\/div><\/div>';\n  el('pQRff').innerHTML = '<button class=\"btn-out\" onclick=\"openShare(\\''+g+'\\')\">'+svg('share',16)+'Compartir link de pago<\/button>'+\n    '<button class=\"btn-out\" style=\"border:0;color:var(--pd);padding:6px;\" onclick=\"openRegistrar(\\''+cs[0].pac+'\\', \\''+g+'\\')\">Registrar que me pagó por otro medio<\/button>';\n};\n\n/* ════════════════════════ PRO · pacientes ════════════════════════ */\nRENDER['p-pacientes'] = function(){\n  var f = CTX.pf || 'todos';\n  var q = (el('pSearch').value || '').trim().toLowerCase();\n  var ids = Object.keys(PAC).sort(function(a,b){ return PAC[a].n.localeCompare(PAC[b].n,'es'); });\n  var list = ids.filter(function(id){\n    var p = PAC[id];\n    if(q.length >= 2 && (p.n + ' ' + p.doc).toLowerCase().indexOf(q) < 0) return false;\n    if(f === 'deuda' && !saldo(id)) return false;\n    if(f === 'recientes' && ['jc','gm','ra'].indexOf(id) < 0) return false;\n    return true;\n  });\n  el('pChips').innerHTML = [['todos','Tod sh({ k:'c', f:c.fecha, o:c }); });\n  if(f !== 'pend') ps.forEach(function(x){ items.push({ k:'p', f:x.fecha, o:x }); });\n  items.sort(function(a,b){ var fa = a.f.split('/').reverse().join(''), fb = b.f.split('/').reverse().join(''); return fb.localeCompare(fa) || (a.k==='p' ? -1 : 1); });\n  var mes = '';\n  items.forEach(function(it){\n    var m = it.f.split('/')[1]; var ml = { '07':'Julio 2026', '08':'Agosto 2026', '09':'Septiembre 2026' }[m] || '';\n    if(ml !== mes){ mes = ml; h += '<div class=\"sh\" style=\"padding-top:8px;\">'+ml+'<\/div>'; }\n    h += it.k==='c' ? movCargo(it.o, true) : movPago(it.o, true);\n  });\n  if(!items.length) h += '<div class=\"emptyline\">No hay movimientos con ese filtro<\/div>';\n  el('pLib').innerHTML = h;\n};\nfunction movCargo(c, pro){\n  var cls = c.estado==='anu' || c.estado==='bon' ? 'mx' : 'c';\n  var fn = pro ? \"openCargo('\"+c.id+\"')\" : (c.estado==='pend' ? \"openGrupo('\"+c.g+\"','a-libreta')\" : (c.pago ? \"openComp('\"+c.pago+\"','a-libreta')\" : ''));\n  return '<div class=\"mov\" onclick=\"'+fn+'\"><div class=\"mi '+cls+'\">'+svg(c.origen==='inasistencia'?'clock':'receipt',17)+'<\/div>'+\n    '<div class=\"grow\"><div class=\"nm s14\">'+c.concepto+'<\/div><div class=\"ln\">'+c.fecha+' · '+ORIGEN[c.origen]+'<\/div><\/div>'+\n    '<div><div class=\"mm '+(c.estado==='anu'||c.estado==='bon'?'strike':'')+'\">'+money(c.monto)+'<\/div><div class=\"ms\">'+tagEstado(c.estado)+'<\/div><\/div><\/div>';\n}\nfunction movPago(p, pro){\n  var fn = pro ? '' : \"openComp('\"+p.id+\"','a-libreta')\";\n  return '<div class=\"mov\" '+(fn?'onclick=\"'+fn+'\"':'style=\"cursor:default\"')+'><div class=\"mi p\">'+svg(p.medio==='mp'?'wallet':'cash',17)+'<\/div>'+\n    '<div class=\"grow\"><div class=\"nm s14\">'+(pro?'Pago recibido':'Tu pago')+'<\/div><div class=\"ln\">'+MEDIO[p.medio]+' · '+p.fecha+' · '+p.hora+'<\/div><\/div>'+\n    '<div class=\"mm neg\">− '+money(p.monto)+'<\/div><\/div>';\n}\nfunction openCargo(id){\n  var c = cargo(id), p = PAC[c.pac];\n  var h = '<div style=\"padding:0 40px 8px 0;\"><div class=\"row\" style=\"justify-content:space-between;\"><div style=\"font-size:17px;font-weight:800;\">'+c.concepto+'<\/div>'+tagEstado(c.estado)+'<\/div>'+\n    '<div class=\"money-big\" style=\"margin-top:6px;\">'+money(c.monto)+'<\/div><div class=\"ln\">'+p.short+' · '+c.fecha+' · '+ORIGEN[c.origen]+'<\/div><\/div><div class=\"divi\"><\/div>';\n  if(c.estado === 'pend'){\n    h += actBtn('', 'Enviar recordatorio', 'Le llega un aviso en la app', 'send', \"close_('PRO','pro-sh-cargo'); recordar('\"+c.pac+\"')\");\n    if(S.mp) h += actBtn('bl', 'Mostrar QR de cobro', null, 'qr', \"close_('PRO','pro-sh-cargo'); openQR('\"+c.g+\"','p-libreta')\");\n    h += actBtn('bl', 'Registrar pago recibido', 'Efectivo, transferencia u otro medio', 'cash', \"close_('PRO','pro-sh-cargo'); openRegistrar('\"+c.pac+\"','','\"+c.id+\"')\");\n    h += actBtn('', 'Bonificar', 'No se lo cobrás. Queda registrado.', 'gift', \"close_('PRO','pro-sh-cargo'); openMotivo('\"+c.id+\"','bon')\");\n    h += actBtn('dg', 'Anular', 'Si se generó por error', 'ban', \"close_('PRO','pro-sh-cargo'); openMotivo('\"+c.id+\"','anu')\");\n  } else if(c.estado === 'pag'){\n    var pg = pago(c.pago);\n    h += '<div class=\"cl\"><div class=\"cc\">Medio<\/div><div class=\"cm\">'+MEDIO[pg.medio]+'<\/div><\/div><div class=\"cl\"><div class=\"cc\">Fecha<\/div><div class=\"cm\">'+pg.fecha+' · '+pg.hora+'<\/div><\/div>'+(pg.op?'<div class=\"cl\"><div class=\"cc\">Operación<\/div><div class=\"cm\">'+pg.op+'<\/div><\/div>':'');\n  } else {\n    h += '<div class=\"note grey\" style=\"margin:8px 0;\">'+svg('info',15)+'<div>'+(c.estado==='bon'?'Bonificado':'Anulado')+(c.motivo?' · '+c.motivo:'')+'. No suma al saldo.<\/div><\/div>';\n  }\n  el('shCargo').innerHTML = h;\n  open_('PRO','pro-sh-cargo');\n}\nfunction openMotivo(id, modo){\n  var c = cargo(id);\n  CTX.mot = { id:id, modo:modo, motivo:'' };\n  var ops = modo === 'anu' ? ['Error de mon no({ tid:tid, prof:'mf', aid:'jc', cargo:c.id, fecha:DAYS[0].fecha, hora:free[0], mod:'Presencial', dia:0 });\n  refresh();\n}\nfunction simMariaPaga(){\n  var ids = pend('gm').map(function(c){ return c.id; });\n  if(!ids.length){ toast('PRO','María González ya está al día'); return; }\n  if(!S.mp){ toast('PRO','Sin Mercado Pago no puede pagarte desde la app'); return; }\n  registrarPago(ids, 'mp', true);\n}\nfunction simCierre(){\n  var t2 = turno('t2');\n  if(t2.estado !== 'conf'){ toast('PAC','La consulta de hoy ya se cerró. Reiniciá la demo para repetirlo.'); return; }\n  t2.estado = 'fin';\n  crearCobro('jc', [{ n:'Consulta general', m:prest('cg').m }, { n:'Electrocardiograma', m:15000 }], 'cierre', 't2');\n}\nfunction simCobroMensaje(){ crearCobro('jc', [{ n:'Consulta por mensaje', m:prest('msg').m }], 'manual', null); }\nfunction simRecordatorio(){\n  if(!saldo('jc')){ toast('PAC','No tenés nada pendiente con el Dr. Fuentes. Simulá un cobro primero.'); return; }\n  recordar('jc');\n}\nfunction simEfectivo(){\n  var ids = pend('jc').map(function(c){ return c.id; });\n  if(!ids.length){ toast('PAC','No tenés cobros pendientes con el Dr. Fuentes'); return; }\n  registrarPago(ids, 'efectivo', false);\n}\n\n/* ═══ guion ═══ */\nfunction demo(n){\n  document.querySelectorAll('.panel .step').forEach(function(b){ b.classList.toggle('on', +b.dataset.step === n); });\n  el('demoHint').innerHTML = (VIEW === 'pro' && n === 3)\n    ? '<b>Profesional:<\/b> el QR está esperando el pago. Tocá «Juana paga lo pendiente» en la sección de abajo y mirá cómo la pantalla pasa sola a «Pago recibido».'\n    : HINTS[n];\n  document.querySelectorAll('.ov').forEach(function(o){ o.classList.remove('on'); });\n  AID = 'jc'; renderCtx();\n  if(n === 1){ resetDemo(true); go('PRO','p-perfil'); go('PAC','a-home'); }\n  if(n === 2){ if(turno('t2').estado !== 'conf') resetDemo(true); S.mp = true; refresh(); go('PRO','p-home'); go('PAC','a-home'); }\n  if(n === 3){\n    S.mp = true;\n    var pendJ = S.cargos.filter(function(c){ return c.pac === 'jc' && c.prof === 'mf' && c.estado === 'pend'; });\n    var g = pendJ.length ? pendJ[pendJ.length - 1].g : null;\n    if(!g){ if(turno('t2').estado !== 'conf') resetDemo(true); S.mp = true; turno('t2').estado = 'fin';\n      g = crearCobro('jc', [{ n:'Consulta general', m:25000 }, { n:'Electrocardiograma', m:15000 }], 'cierre', 't2'); }\n    refresh(); openQR(g, 'p-home'); go('PAC','a-home');\n  }\n  if(n === 4){ go('PRO','p-home'); }\n  if(n === 5){ if(!pend('gm').length) resetDemo(true); go('PRO','p-libreta',{ libPac:'gm', libBack:'p-pacientes', lf:'todo' }); }\n  if(n === 6){ go('PAC','a-cuentas'); }\n  if(n === 7){\n    S.mp = true;\n    if(turno('t2').estado !== 'conf' && !S.cargos.some(function(c){ return c.turno === 't2' && c.estado === 'pend'; })) resetDemo(true);\n    S.mp = true;\n    if(turno('t2').estado === 'conf'){ turno('t2').estado = 'fin'; crearCobro('jc', [{ n:'Consulta general', m:25000 }, { n:'Electrocardiograma', m:15000 }], 'cierre', 't2'); }\n    refresh(); go('PRO','p-home'); openAtencion({ t:'t2' }, 'a-home');\n  }\n  if(n === 8){ S.mp = true; S.momento = 'reserva'; refresh(); go('PRO','p-agenda'); go('PAC','a-home'); }\n  if(n === 9){ if(cargo('c7').estado !== 'pend') resetDemo(true); openGrupo('g7','a-home'); }\n  if(n === 10){ if(!aPend('bc').length) resetDemo(true); go('PAC','a-home'); }\n  if(n === 11){ go('PAC','a-cuentas'); }\n  if(n === 12){\n    S.mp = true;\n    var pj = S.cargos.filter(function(c){ return c.pac === 'jc' && c.prof === 'mf' && c.estado === 'pend'; });\n    var g2 = pj.length ? pj[pj.length - 1].g : crearCobro('jc', [{ n:'Consulta por mensaje', m:prest('msg').m }], 'manual', null);\n    refresh(); openQR(g2, 'p-home'); go('PAC','a-home');\n  }\n  if(n === 13){ go('PRO','p-cobros'); }\n}\nfunction resetDemo(silent){\n  initState(); CTX = {}; AID = 'jc';\n  document.querySelectorAll('.ov').forEach(function(o){ o.classList.remove('on'); });\n  el('pSearch').value = '';\n  renderCtx(); go('PRO','p-home'); go('PAC','a-home'); refresh();\n  if(!silent){ document.querySelectorAll('.panel .step').forEach(function(b){ b.classList.remove('on'); }); el('demoHint').innerHTML = 'Demo reiniciada. Elegí un paso del guion o navegá libremente.'; }\n}\n\n/* ══════════════════════════════════════════════════════════════════════\n   VERSIÓN FINAL · minuta del 28/09\n   Estas definiciones reemplazan a las anteriores (se declaran después).\n   ══════════════════════════════════════════════════════════════════════ */\nORIGEN.acto = 'Acto médico';\nORIGEN.manual = 'Cobro independiente';\nvar MES = '09';\n\nfunction tagEstado(e){ return { pend:'<span class=\"tag t-pend\">Pendiente<\/span>', pag:'<span class=\"tag t-pag\">Pagado<\/span>',\n  bon:'<span class=\"tag t-bon\">Bonificado<\/span>', anu:'<span class=\"tag t-anu\">Anulado<\/span>', conf:'<span class=\"tag t-cnf\">Por confirmar<\/span>',\n  sc:'<span class=\"tag t-sc\">Sin cargo<\/span>', rech:'<span class=\"tag t-rech\">No reconocido<\/span>' }[e] || ''; }\nfunction gruposConf(aid){\n  var gs = {}, order = [];\n  S.cargos.filter(function(c){ return c.pac === aid && c.estado === 'conf'; }).forEach(function(c){ if(!gs[c.g]){ gs[c.g] = []; order.push(c.g); } gs[c.g].push(c); });\n  return order.reverse().map(function(g){ return { g:g, cs:gs[g] }; });\n}\n\n/* ═══ cobros: cada línea puede tener su propio estado ═══ */\nfunction crearCobro(pac, lines, origen, turnoId){\n  var g = nid('g');\n  lines.forEach(function(l){\n    var est = l.est || (origen === 'manual' ? 'conf' : 'pend');\n    S.cargos.push({ id:nid('c'), prof:'mf', pac:pac, g:g, concepto:l.n, monto:est === 'sc' ? 0 : Math.max(0, +l.m || 0), fecha:HOY, origen:origen, estado:est, turno:turnoId || null });\n  });\n  var cs = S.cargos.filter(function(c){ return c.g === g; });\n  var cob = cs.filter(function(c){ return c.estado === 'pend' || c.estado === 'conf'; });\n  if(pac === 'jc' && cs.length){\n    var tot = money(sum(cob));\n    var txt = origen === 'cierre' ? 'Te envió el detalle de tu consulta de hoy: ' + tot :\n              origen === 'inasistencia' ? 'Registró una inasistencia al turno de hoy: ' + tot :\n              origen === 'manual' ? 'Te envió un cobro para revisar: ' + resumenConceptos(cs).toLowerCase() + ' · ' + tot :\n              'Registró ' + resumenConceptos(cs).toLowerCase() + (cob.length ? ': ' + tot : ', sin cargo');\n    var act = (origen === 'cierre' && turnoId) ? { aid:'jc', t:turnoId } : { aid:'jc', g:g };\n    addNotif('Dr. Marcos Fuentes', txt, origen === 'manual' ? 'revisar' : 'cobro', act);\n    setTimeout(function(){ push('PAC', 'Dr. Marcos Fuentes', txt, function(){ enId('jc', function(){ if(act.t) openAtencion({ t:act.t }, 'a-home'); else openGrupo(g, 'a-home'); }); }); }, 500);\n  }\n  refresh();\n  return g;\n}\n\n/* ═══ menús de acciones (reemplazan al botón central y al flotante) ═══ */\nfunction ddi(cls, ic, l, s, fn){ return '<button class=\"ddi '+cls+'\" onclick=\"'+fn+'\"><span class=\"di\">'+svg(ic,17)+'<\/span><span class=\"grow\">'+l+'<small>'+s+'<\/small><\/span><\/button>'; }\nfunction openDD(ph){\n  var h = '';\n  if(ph === 'PRO'){\n    h += ddi('fin', 'cobro', 'Nuevo cobro', 'Para algo que no está atado a un turno', \"closeDD('PRO'); openNuevo(null)\");\n    h += ddi('', 'qr', 'Cobrar con QR', 'Para quien no usa la app', \"closeDD('PRO'); openNuevo(null, true)\");\n    if(S.medios.efectivo) h += ddi('', 'cash', 'Registrar efectivo', 'Un pago que recibiste por fuera', \"closeDD('PRO'); pickEfectivo()\");\n    h += '<div class=\"ddsep\"><\/div>' + ddi('', 'gear', 'Configurar cobros', 'Momento, medios, precios y tope', \"closeDD('PRO'); go('PRO','p-cobros')\");\n  } else {\n    var tot = sum(aPend(AID));\n    h += ddi('fin', 'cobro', 'Pagar lo pendiente', tot ? money(tot) + ' en total' : 'No hay nada pendiente', \"closeDD('PAC'); pagarPendiente()\");\n    h += ddi('', 'check', 'Elegir qué pagar', 'Pagá solo algunos cobros', \"closeDD('PAC'); openElegir()\");\n    h += ddi('', 'qr', 'Escanear QR del consultorio', 'Para pagar en el momento', \"closeDD('PAC'); go('PAC','a-scan')\");\n  }\n  el(ph + '-ddm').innerHTML = h;\n  el(ph + '-dd').classList.add('on');\n}\nfunction closeDD(ph){ el(ph + '-dd').classList.remove('on'); }\n\n/* ═══ fila de movimiento compartida por los dos lados ═══ */\nfunction rowMov(who, titulo, sub, monto, tag, fn, kind){\n  var col = kind === 'in' ? 'var(--gt)' : kind === 'off' ? 'var(--mut2)' : 'var(--t)';\n  return '<div class=\"mov\" onclick=\"'+fn+'\">'+who+'<div class=\"grow\"><div class=\"nm s14\">'+titulo+'<\/div><div class=\"ln\">'+sub+'<\/div><\/div>'+\n    '<div style=\"text-align:right;\"><div class=\"mm\" style=\"color:'+col+(kind === 'off' ? ';text-decoration:line-through' : '')+'\">'+monto+'<\/div>'+(tag ? '<div class=\"ms\">'+tag+'<\/div>' : '')+'<\/div><\/div>';\n}\nfunction agrupar(items){\n  items.sort(function(a,b){ var fa = a.f.split('/').reverse().join(''), fb = b.f.split('/').reverse().join(''); return fb.localeCompare(fa) || (a.k === 'p' ? -1 : 1); });\n  var h = '', last = '';\n  items.forEach(function(it){ if(it.f !== last){ last = it.f; h += '<div class=\"dayh\">'+(it.f === HOY ? 'Hoy' : it.f)+'<\/div>'; } h += it.html; });\n  return h;\n}\n\n/* ════════════════════════ PRO · Finanzas ════════════════════════ */\nRENDER['p-tes'] = function(){\n  var v = CTX.tv || 'mov';\n  var mes = S.cargos.filter(function(c){ return c.prof === 'mf' && c.fecha.slice(3) === MES; });\n  var fact = sum(mes.filter(function(c){ return c.estado === 'pend' || c.estado === 'pag'; }));\n  var cobr = sum(S.pagos.filter(function(p){ return p.prof === 'mf' && p.fecha.slice(3) === MES; }));\n  var pendAll = sum(S.cargos.filter(function(c){ return c.prof === 'mf' && c.estado === 'pend'; }));\n  var pct = cobr + pendAll ? Math.round(cobr * 100 / (cobr + pendAll)) : 0;\n  var h = '<div class=\"bal\"><div class=\"kk\">Cobrado en septiembre<\/div><div class=\"kv\">'+money(cobr)+'<\/div>'+\n    '<div class=\"row2b\"><div class=\"mini\"><span>Facturado<\/span><b>'+money(fact)+'<\/b><\/div><div class=\"mini\"><span>Pendiente<\/span><b>'+money(pendAll)+'<\/b><\/div><\/div>'+\n    '<div class=\"barx\"><i style=\"width:'+pct+'%\"><\/i><\/div><\/div>';\n  h += '<div class=\"segt\"><button class=\"'+(v === 'mov' ? 'on' : '')+'\" onclick=\"CTX.tv=\\'mov\\'; RENDER[\\'p-tes\\']()\">Movimientos<\/button><button class=\"'+(v === 'pac' ? 'on' : '')+'\" onclick=\"CTX.tv=\\'pac\\'; RENDER[\\'p-tes\\']()\">Por paciente<\/button><\/div>';\n  if(v === 'mov'){\n    var f = CTX.tf || 'todos';\n    h += '<div style=\"padding:0 18px 10px;\"><div class=\"iw\">'+svg('search',17)+'<input id=\"tesQ\" placeholder=\"Buscar paciente o concepto\" value=\"'+(CTX.tq || '')+'\" oninput=\"CTX.tq=this.value; tesList()\"/><\/div><\/div>';\n    h += '<div class=\"chips scroll-x\" style=\"padding-bottom:6px;\">'+[['todos','Todos'],['cob','Cobrado'],['pend','Pendiente'],['conf','Por confirmar'],['efe','Efectivo']].map(function(c){\n      return '<button class=\"chip '+(f === c[0] ? 'sel' : '')+'\" onclick=\"CTX.tf=\\''+c[0]+'\\'; RENDER[\\'p-tes\\']()\">'+c[1]+'<\/button>'; }).join('')+'<\/div>';\n    h += '<div id=\"tesList\"><\/div>';\n  } else {\n    var ids = Object.keys(PAC).sort(function(a,b){ return saldo(b) - saldo(a) || PAC[a].n.localeCompare(PAC[b].n,'es'); });\n    h += ids.map(function(id){ var p = PAC[id], s = saldo(id), nc = cargosDe(id).filter(function(c){ return c.estado === 'conf'; }).length;\n      return '<div class=\"acct\" onclick=\"go(\\'PRO\\',\\'p-libreta\\',{libPac:\\''+id+'\\',libBack:\\'p-tes\\'})\">'+avatar(p)+'<div class=\"grow\"><div class=\"nm s14\">'+p.n+'<\/div><div class=\"ln\">'+(nc ? nc+' por confirmar · ' : '')+p.doc+'<\/div><\/div>'+\n        '<div style=\"text-align:right;\">'+(s ? '<div style=\"font-size:13.5px;font-weight:800;color:var(--amt);\">'+money(s)+'<\/div>'+(S.tope.on && s > S.tope.monto ? '<span class=\"tag t-anu\" style=\"display:inline-block;marg a cuenta de \" + nom + \"')\");\n  render();\n  g('addcheck');\n}\n\n/* ═══════ Profesionales ═══════ */\nfunction profsFiltrados(){\n  var q = (document.getElementById('profQ') ? document.getElementById('profQ').value : '').trim().toLowerCase();\n  return IDENT[actual].profs\n    .slice()\n    .sort(function(a,b){ return a.ape.localeCompare(b.ape,'es'); })\n    .filter(function(p){ return !q || (p.nom + ' ' + p.esp).toLowerCase().indexOf(q) >= 0; });\n}\nfunction abrirProf(i){\n  profSel = profsFiltrados()[i];\n  document.getElementById('pfT').textContent = profSel.nom;\n  document.getElementById('pfS').textContent = profSel.esp + ' · con acceso desde el ' + profSel.desde;\n  abrir('ovProf');\n}\nfunction abrirShare(){\n  cerrar('ovProf');\n  document.getElementById('shT').textContent = 'Compartir a ' + profSel.nom;\n  document.getElementById('shS').textContent = profSel.esp + ' · mandale su perfil a alguien que esté buscando profesional.';\n  document.getElementById('shLink').textContent = profSel.link;\n  abrir('ovShare');\n}\nfunction pedirRevocar(){\n  cerrar('ovProf');\n  var d = IDENT[actual];\n  document.getElementById('rvT').textContent = '¿Revocar el acceso de ' + profSel.nom + '?';\n  document.getElementById('rvP').innerHTML = 'Va a dejar de ver ' + (d.own ? 'tu historia clínica' : 'la historia clínica de ' + d.tab) +\n    ' de inmediato.<br/><br/><strong>Lo que ya registró queda intacto.<\/strong> Podés volver a habilitarlo cuando quieras.';\n  abrir('ovRevoke');\n}\nfunction revocar(){\n  var d = IDENT[actual];\n  d.profs = d.profs.filter(function(x){ return x.nom !== profSel.nom; });\n  cerrar('ovRevoke'); renderProfs(); showToast('Acceso revocado');\n}\n\n/* ═══════ Render ═══════ */\nfunction render(){\n  var d = IDENT[actual], ctx = !d.own;\n  document.getElementById('inner').classList.toggle('dlctx', ctx);\n  document.getElementById('hdrHola').textContent = d.hola;\n\n  var html = '';\n  for(var i = 0; i < ORDEN.length; i++){\n    var k = ORDEN[i]; \" cy=\"2\" r=\"2\"/><circle cx=\"2\" cy=\"8.5\" r=\"2\"/><circle cx=\"2\" cy=\"15\" r=\"2\"/><\/svg><\/button>' : '') +\n    '<\/div>' +\n    (t.hora !== '—' ? '<div class=\"meta\"><span>' + t.fecha + '<\/span><span class=\"sep\">•<\/span><span>' + t.hora + '<\/span><span class=\"sep\">•<\/span><span class=\"mut\">' + t.mod + '<\/span><\/div>' : '');\n\n  document.getElementById('paySlot').innerHTML = d.pago\n    ? '<div class=\"paycard\"><div class=\"pi\"><b>' + d.pago.prof + '<\/b><span>' + d.pago.det + '<\/span><\/div>' +\n      '<button class=\"paybtn\" onclick=\"showToast(\\'Abre el flujo de pago\\')\">Pagar ahora<\/button><\/div>'\n    : '<div class=\"emptyline\">No hay pagos pendientes<\/div>';\n\n  var h = d.hist;\n  document.getElementById('histSlot').innerHTML = (h.ini !== '—')\n    ? '<div class=\"card\"><div class=\"row\"><div class=\"av ' + h.cls + '\">' + h.ini + '<\/div>' +\n      '<div style=\"flex:1;min-width:0\"><div class=\"n\">' + h.prof + '<\/div><div class=\"m\">' + h.det + '<\/div><\/div>' +\n      '<div style=\"display:flex;flex-direction:column;gap:5px;align-items:flex-end\">' +\n      '<span class=\"tag tag-fin\">Finalizado<\/span><span class=\"tag tag-pag\">Pagado<\/span><\/div><\/div><\/div>'\n    : '<div class=\"emptyline\">Todavía no hay atenciones registradas<\/div>';\n\n  document.getElementById('qaDocs').textContent  = d.own ? 'Mis documentos' : 'Sus documentos';\n  document.getElementById('qaProfs').textContent = d.own ? 'Mis profesionales' : 'Sus profesionales';\n}\n\nfunction renderProfs(){\n  var d = IDENT[actual];\n  document.getElementById('profsTitle').textContent = d.own ? 'Mis profesionales' : 'Profesionales de ' + d.tab;\n  document.getElementById('profsNote').innerHTML = d.own\n    ? 'Estos profesionales pueden ver tu historia clínica porque les diste un turno o aceptaste su solicitud.'\n    : 'Estos profesionales pueden ver la historia clínica de ' + d.tab + '. Los accesos los autorizaste vos, en su representación.';\n  var list = profsFiltrados();\n  var total = d.profs.length;\n  document.getElementById('profsCount').textContent = list.length === total\n    ? total + (total === 1 ? ' profesional' : ' profesionales')\n    : list.length + (list.length === 1 ? ' resultado' : ' resultados') + ' de ' + total;\n  document.getElementById('profsList').innerHTML = list.length ? list.map(function(x,i){\n    return '<div class=\"lrow\"><div class=\"av ' + x.cls + '\">' + x.ini + '<\/div>' +\n      '<div class=\"lb\"><b>' + x.nom + '<\/b><span>' + x.esp + ' · desde el ' + x.desde + '<\/span><\/div>' +\n      '<button class=\"kebab\" onclick=\"abrirProf(' + i + ')\"><svg width=\"4\" height=\"17\" viewBox=\"0 0 4 17\" fill=\"currentColor\"><circle cx=\"2\" cy=\"2\" r=\"2\"/><circle cx=\"2\" cy=\"8.5\" r=\"2\"/><circle cx=\"2\" cy=\"15\" r=\"2\"/><\/svg><\/button><\/div>';\n  }).join('') : '<div class=\"emptyline\">Sin resultados<\/div>';\n}\n\nfunction renderMenores(){\n  var out = '';\n  for(var i = 0; i < ORDEN.length; i++){\n    var k = ORDEN[i], m = IDENT[k];\n    if(m.own) continue;\n    out += '<div class=\"lrow\" onclick=\"pedirCambio(\\'' + k + '\\')\"><div class=\"av ' + m.cls + '\">' + m.ini + '<\/div>' +\n      '<div class=\"lb\"><b>' + m.nombre + '<\/b><span>' + m.doc + ' · ' + m.edad.split(' (')[0] + '<\/span><\/div>' +\n      '<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"/><\/svg><\/div>';\n  }\n  document.getElementById('menoresList').innerHTML = out;\n}\n\nfunction marcarLeidas(){\n  var ns = document.querySelectorAll('#notifList .nt');\n  for(var i = 0; i < ns.length; i++) ns[i].classList.remove('unread');\n  var ds = document.querySelectorAll('#notifList .udot');\n  for(var j = ds.length - 1; j >= 0; j--) ds[j].parentNode.removeChild(ds[j]);\n  var bd = document.getElementById('bellDot'); if(bd) bd.style.display = 'none';\n  showToast('Notificaciones marcadas como leídas');\n}\n\nrender();\n<\/script>\n<script>\n/* iurumi · puente módulo ↔ shell. Lo inyecta src/build.js al final de cada módulo\n   (el build completa el id del módulo, su configuración y la función que muestra una pantalla). */\n(function () {\n  var MOD = \"identidad\";\n  var CFG = {\"screenSel\":\".s.active\",\"screenAttr\":\"data-scr\",\"screenRoot\":\".s\",\"navSel\":\"nav.bn\",\"navItems\":[{\"id\":\"inicio\",\"label\":\"Inicio\",\"icon\":\"<svg viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\\\"/><polyline points=\\\"9 22 9 12 15 12 15 22\\\"/><\/svg>\",\"badge\":null},{\"id\":\"turnos\",\"label\":\"Turnos\",\"icon\":\"<svg viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><rect x=\\\"3\\\" y=\\\"4\\\" width=\\\"18\\\" height=\\\"18\\\" rx=\\\"2\\\"/><path d=\\\"M16 2v4M8 2v4M3 10h18\\\"/><\/svg>\",\"badge\":null},{\"id\":\"finanzas\",\"label\":\"Finanzas\",\"icon\":\"<svg viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><rect width=\\\"20\\\" height=\\\"14\\\" x=\\\"2\\\" y=\\\"5\\\" rx=\\\"2\\\"/><path d=\\\"M2 10h20\\\"/><\/svg>\",\"badge\":null},{\"id\":\"perfil\",\"label\":\"Perfil\",\"icon\":\"<svg viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><circle cx=\\\"12\\\" cy=\\\"8\\\" r=\\\"4\\\"/><path d=\\\"M4 21a8 8 0 0 1 16 0\\\"/><\/svg>\",\"badge\":null}],\"area\":\"inicio\",\"areaByScreen\":null};\n  var SHOW = function (S, ARG) { g(S); };\n\n  function send(m) {\n    m.iu = 1; m.mod = MOD;\n    try { parent.postMessage(m, '*'); } catch (e) {}\n  }\n\n  var IU = window.IU = {\n    mod: MOD,\n    state: {},\n    on: {},\n    /* Navega a otro módulo (o a otra pantalla de este). */\n    go: function (mod, scr, arg) { send({ t: 'go', to: mod, scr: scr || null, arg: arg === undefined ? null : arg }); },\n    /* Vuelve a la pantalla anterior del recorrido (aunque sea de otro módulo). */\n    back: function () { send({ t: 'back' }); },\n    /* Abre el otro rol (paciente.html ↔ profesional.html) en una pantalla. */\n    rol: function (rol, mod, scr) { send({ t: 'rol', rol: rol, to: mod, scr: scr || null }); },\n    /* Estado compartido de la demo entre módulos (p. ej. turno reservado). */\n    set: function (k, v) { IU.state[k] = v; send({ t: 'set', k: k, v: v }); },\n    toast: function (msg) {\n      var fn = window.showToast || window.toast;\n      if (typeof fn === 'function') { try { fn(msg); return; } catch (e) {} }\n      send({ t: 'toast', msg: msg });\n    }\n  };\n\n  /* Pantalla activa del módulo. */\n  function cur() {\n    var el = null, list = document.querySelectorAll(CFG.screenSel || '.s.active');\n    for (var i = 0; i < list.length; i++) {\n      if (list[i].offsetParent !== null || getComputedStyle(list[i]).display !== 'none') { el = list[i]; break; }\n    }\n    if (!el) return null;\n    return el.getAttribute(CFG.screenAttr || 'data-screen') || el.id || null;\n  }\n\n  /* ¿La pantalla activa muestra la nav inferior? */\n  function navVisible() {\n    if (!CFG.navSel) return false;\n    var navs = document.querySelectorAll(CFG.navSel);\n    for (var i = 0; i < navs.length; i++) {\n      var r = navs[i].getBoundingClientRect();\n      if (r.width > 0 && r.height > 0 && getComputedStyle(navs[i]).visibility !== 'hidden') return true;\n    }\n    return false;\n  }\n\n  /* Nav inferior unificada del rol: reemplaza el contenido de las navs del módulo\n     y marca el ítem activo según la pantalla (la del contenedor o, si la nav es global, la activa). */\n  function areaFor(scr) {\n    return (CFG.areaByScreen && scr && CFG.areaByScreen[scr]) || CFG.area;\n  }\n  function renderNav() {\n    if (!CFG.navSel || !CFG.navItems) return;\n    var navs = document.querySelectorAll(CFG.navSel);\n    var now = cur();\n    for (var i = 0; i < navs.length; i++) {\n      var nav = navs[i];\n      if (!nav.getAttribute('data-iu-nav')) {\n        var html = '';\n        for (var k = 0; k < CFG.navItems.length; k++) {\n          var it = CFG.navItems[k];\n          html += '<button type=\"button\" class=\"iu-bni\" data-iu-to=\"' + it.id + '\">' +\n            it.icon + '<span>' + it.label + '<\/span>' + (it.badge ? '<i class=\"iu-badge\">' + it.badge + '<\/i>' : '') + '<\/button>';\n        }\n        nav.innerHTML = html;\n        nav.classList.add('iu-bn');\n        nav.setAttribute('data-iu-nav', '1');\n      }\n      var host = nav.closest(CFG.screenRoot || '.s');\n      var scr = host ? (host.getAttribute(CFG.screenAttr || 'data-screen') || host.id) : now;\n      var area = areaFor(scr);\n      var bs = nav.querySelectorAll('.iu-bni');\n      for (var j = 0; j < bs.length; j++) bs[j].classList.toggle('act', bs[j].getAttribute('data-iu-to') === area);\n    }\n  }\n\n  document.addEventListener('click', function (e) {\n    var b = e.target.closest && e.target.closest('[data-iu-to]');\n    if (!b) return;\n    e.preventDefault(); e.stopPropagation();\n    send({ t: 'nav', area: b.getAttribute('data-iu-to') });\n  }, true);\n\n  /* Ningún alert/confirm nativo: en el visor no se muestran. */\n  window.alert = function (m) { IU.toast(String(m)); };\n\n  var last = null;\n  function report(force) {\n    var s = cur();\n    if (s && (force || s !== last)) { last = s; send({ t: 'screen', scr: s, nav: navVisible() }); }\n  }\n\n  window.addEventListener('message', function (e) {\n    var d = e.data;\n    if (!d || !d.iu || d.from !== 'shell') return;\n    if (d.state) IU.state = d.state;\n    if (d.t === 'show') {\n      try {\n        if (d.state && typeof IU.on.state === 'function') IU.on.state(IU.state);\n        if (d.scr) SHOW(d.scr, d.arg);\n        if (d.arg !== null && d.arg !== undefined && typeof IU.on.arg === 'function') IU.on.arg(d.arg, d.scr);\n      } catch (err) { console.error('[iurumi] show', d.scr, err); }\n      renderNav();\n      report(true);\n    } else if (d.t === 'state') {\n      if (typeof IU.on.state === 'function') IU.on.state(IU.state);\n    }\n  });\n\n  var pending = 0;\n  new MutationObserver(function () {\n    clearTimeout(pending);\n    pending = setTimeout(function () { renderNav(); report(false); }, 40);\n  }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'style'] });\n\n  renderNav();\n  send({ t: 'ready', scr: cur() });\n})();\n\n<\/script>\n<script>\n/* Módulo «identidad» del paciente (home v11): menores a cargo y Mis profesionales.\n   La home de la v11 vive dentro del módulo «inicio» (finanzas v8 la reconstruye con la capa de pagos). */\n(function () {\n  window.iuHome = function () { IU.set('identidad', actual); IU.go('inicio', 'a-home'); };\n\n  IU.on.state = function (st) {\n    if (st.identidad && IDENT[st.identidad] && st.identidad !== actual) {\n      actual = st.identidad; render();\n      if (document.querySelector('[data-scr=\"profs\"].active')) renderProfs();\n      if (document.querySelector('[data-scr=\"menores\"].active')) renderMenores();\n    }\n  };\n\n  /* Un menor nuevo también existe para finanzas (pestaña en la home). */\n  var _crear = crearMenor;\n  window.crearMenor = function () {\n    var n = ORDEN.length;\n    _crear();\n    if (ORDEN.length > n) {\n      var k = ORDEN[ORDEN.length - 1], d = IDENT[k];\n      IU.set('nuevoMenor', { key: k, tab: d.tab, ini: d.ini, nombre: d.nombre, doc: d.doc, edad: d.edad });\n    }\n  };\n\n  /* Datos alineados con finanzas v8: Juana se atiende con el Dr. Fuentes (turno de hoy). */\n  IDENT.juana.profs.push({ ini: 'MF', cls: 'av-mf', nom: 'Dr. Marcos Fuentes', ape: 'Fuentes', esp: 'Médico clínico',\n    desde: '14/07/2026', link: 'iurumi.app/p/marcos-fuentes', turnos: true });\n  IDENT.dante.profs[0].turnos = true;    /* Dr. Molina: turno el 30/09 */\n  IDENT.benicio.profs[0].turnos = true;  /* Dra. Ferreyra: turno el 05/10 */\n\n  /* «Sacar turno» abre la reserva de finanzas con ese profesional. */\n  var PK = { 'Dr. Marcos Fuentes': 'mf', 'Dra. María García': 'mg', 'Dr. Sergio Molina': 'sm', 'Dra. Lucía Ferreyra': 'lf' };\n  window.iuSacarTurno = function () {\n    cerrar('ovProf');\n    IU.set('identidad', actual);\n    IU.go('inicio', 'a-tn', { bk: PK[profSel.nom] || '' });\n  };\n\n  /* Regla de la app: el acceso que viene de un turno no se puede revocar mientras haya turnos. */\n  var REVOCAR_SUB = 'Deja de ver la historia clínica';\n  var BLOQUEO = 'Mientras tenga turnos con vos, el acceso no se puede quitar';\n  var _ap = abrirProf;\n  window.abrirProf = function (i) {\n    _ap(i);\n    var b = document.querySelector('#ovProf .act.dg'), s = b.querySelector('small');\n    b.classList.toggle('iu-off', !!profSel.turnos);\n    s.textContent = profSel.turnos ? BLOQUEO : REVOCAR_SUB;\n    b.setAttribute('onclick', profSel.turnos ? \"showToast('\" + BLOQUEO + \"')\" : 'pedirRevocar()');\n  };\n})();\n\n\n<\/script>\n<\/body>\n<\/html>\n"},"mvp":{"nombre":"Alta, perfil, cobertura y documentos","bloque":"B1 · B3","fuente":"MVP del paciente.html (contiene las partes a-d)","nota":"MVP del paciente de julio. Contiene completas las partes a, b, c y d. Se usa para el alta, el perfil, la cobertura, los documentos y la sala de espera. Datos alineados con el resto: Juana Colombres, documentos de julio a septiembre de 2026.","inicio":"welcome","pantallas":[{"id":"welcome","label":"P01 · Bienvenida"},{"id":"login","label":"P02 · Iniciar sesión","nota":"Copy de la app: «Iniciá sesión / Ingresá tus credenciales para continuar»."},{"id":"forgot","label":"P03 · Recuperar contraseña"},{"id":"forgot-sent","label":"P04 · Revisá tu correo"},{"id":"signup","label":"P05 · Cr llega ahí."},{"id":"p20","label":"P20 · Consulta finalizada","nota":"«Continuar» cierra la atención del lado del profesional y abre el resumen con el cobro (finanzas v8), que reemplaza a P21 del MVP."}],"html":"<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>iurumi · MVP Paciente · Prototipo consolidado<\/title>\n<style>\n/* ============================================================\n   iurumi · MVP Paciente · CSS consolidado (A + B + C + D)\n   Regla: D gana en colisiones (excepto .iw)\n   ============================================================ */\n\n:root{\n  --p:#6366F1; --pd:#4F46E5; --b:#3B82F6; --bd:#2563EB;\n  --acc:#F97316; --bg:#F8FAFC; --t:#0F172A;\n  --g:#10B981; --r:#EF4444;\n  --bd-light:#E2E8F0; --bd-soft:#F1F5F9;\n  --bdl:#E2E8F0; --bds:#F1F5F9;\n  --mut:#64748B; --mut2:#94A3B8;\n  --wa:#25D366; --waD:#075E54;\n  --am:#F59E0B; --amb:#FFFBEB; --amBd:#FDE68A; --amT:#92400E;\n}\n\n*{ box-sizing:border-box; -webkit-font-smoothing:antialiased; margin:0; padding:0; }\nhtml,body{ font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--t); }\nbody{\n  background:linear-gradient(180deg,#EEF2FF,#F8FAFC);\n  min-height:100vh; padding:24px 12px 60px;\n  display:flex; align-items:flex-start; justify-content:center;\n}\nbutton{ font-family:inherit; cursor:pointer; }\n\n/* ============ PHONE FRAME ============ */\n.phone{\n  width:390px; height:844px; background:#0F172A;\n  border-radius:54px; padding:14px; position:sticky; top:24px;\n  box-shadow:0 30px 80px -20px rgba(15,23,42,.35); flex-shrink:0;\n}\n.inner, .screen{\n  width:100%; height:100%; border-radius:42px; overflow:hidden;\n  background:var(--bg); position:relative; display:flex; flex-direction:column;\n}\n.screen{ border-radius:40px; }\n.notch{\n  position:absolute; top:8px; left:50%; transform:translateX(-50%);\n  width:120px; height:28px; background:#0F172A; border-radius:20px; z-index:50;\n}\n.pill{\n  position:absolute; top:20px; left:50%; transform:translateX(-50%);\n  width:82px; height:20px; background:#0F172A; border:1px solid #1E293B;\n  border-radius:20px; z-index:60;\n}\n.hi{\n  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);\n  width:130px; height:5px; background:#fff; opacity:.4;\n  border-radius:5px; z-index:55;\n}\n.sb{\n  height:44px; padding:0 26px; display:flex; align-items:center;\n  justify-content:space-between; font-size:13px; font-weight:600;\n  color:#0F172A; flex-shrink:0;\n}\n\n/* ============ SCREEN SWITCHER ============ */\n.s{ display:none; flex:1; flex-direction:column; overflow:hidden; }\n.s.active{ display:flex; animation:fi .25s ease; }\n@keyframes fi{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }\n.scroll{ flex:1; overflow-y:auto; scrollbar-width:none; }\n.scroll::-webkit-scrollbar{ width:0; display:none; }\n\n/* ============ APPBAR (D gana: back 36×36 blanco con border) ============ */\n.appbar{\n  display:flex; align-items:center; padding:8px 18px 12px;\n  gap:10px; flex-shrink:0;\n}\n.appbar .back{\n  width:36px; height:36px; border-radius:50%;\n  background:#fff; border:1px solid var(--bdl);\n  display:grid; place-items:center; color:#334155;\n  flex-shrink:0; cursor:pointer;\n}\n.appbar h1{ font-size:18px; font-weight:800; flex:1; }\n.appbar .kebab{\n  width:36px; height:36px; border-radius:50%; background:transparent;\n  border:0; display:grid; place-items:center; color:var(--mut); flex-shrink:0;\n}\n\n/* ============ LOGO ============ */\n.logo{ font-weight:800; font-size:18px; color:var(--pd); letter-spacing:-.02em; }\n.logo .dot{ color:var(--acc); }\n\n/* ============ SECTION HEADER ============ */\n.sh{\n  font-size:10px; font-weight:700; text-transform:uppercase;\n  letter-spacing:.08em; color:var(--mut2); margin:16px 18px 10px;\n  display:flex; justify-content:space-between; align-items:center;\n}\n\n/* ============ BUTTONS (D gana: .btn violeta por defecto) ============ */\n.btn{\n  background:var(--p); color:#fff; border-radius:9999px;\n  padding:14px 20px; font-size:14px; font-weight:700;\n  border:0; box-shadow:0 8px 20px -6px rgba(99,102,241,.5);\n  display:inline-flex; align-items:center; justify-content:center;\n  gap:8px; width:100%; transition:transform .1s ease;\n  font-family:inherit;\n}\n.btn:active{ transform:scale(.98); }\n.btn.purple{ background:var(--p); box-shadow:0 8px 20px -6px rgba(99,102,241,.5); }\n.btn.b{ background:var(--b); box-shadow:0 8px 20px -6px rgba(59,130,246,.5); }\n.btn.r, .btn.red{ background:var(--r); box-shadow:0 8px 20px -6px rgba(239,68,68,.5); }\n.btn.g{ background:var(--g); box-shadow:0 8px 20px -6px rgba(16,185,129,.5); }\n.btn.dis{ background:#CBD5E1; box-shadow:none; color:#fff; cursor:not-allowed; opacity:.9; }\n\n.btn-out{\n  background:#fff; color:#334155; border:1px solid var(--bdl);\n  border-radius:9999px; padding:13px 18px; font-size:13px; font-weight:700;\n  display:inline-flex; align-items:center; justify-content:center;\n  gap:6px; width:100%; font-family:inherit; cursor:pointer;\n}\n.btn-out.pv{ color:var(--p); border-color:var(--bdl); }\n.btn-out.rd{ color:var(--r); border-color:#FECACA; }\n.btn-out.dark{ color:#334155; }\n\n.btn-danger{\n  background:#fff; color:var(--r); border:1px solid #FECACA;\n  border-radius:9999px; padding:12px 20px; font-weight:600;\n  width:100%; font-size:13px; display:flex; align-items:center;\n  justify-content:center; gap:6px; font-family:inherit; cursor:pointer;\n}\n\n.btn-google{\n  background:#fff; color:#0F172A; border-radius:9999px;\n  padding:14px 22px; font-weight:600; width:100%; border:1px solid var(--bd-light);\n  display:flex; align-items:center; justify-content:center; gap:10px;\n  font-size:14px; font-family:inherit; cursor:pointer;\n}\n.btn-apple{\n  background:#0F172A; color:#fff; border-radius:9999px;\n  padding:14px 22px; font-weight:600; width:100%; border:none;\n  display:flex; align-items:center; justify-content:center; gap:10px;\n  font-size:14px; font-family:inherit; cursor:pointer;\n}\n.g-text{ font-weight:800; font-size:16px; }\n.g-text .a{ color:#4285F4; } .g-text .b{ color:#EA4335; }\n.g-text .c{ color:#FBBC05; } .g-text .d{ color:#34A853; }\n\n/* ============ INPUTS (.iw preserva A/B: sin margen) ============ */\n.iw{\n  background:#fff; border:1px solid var(--bd-light); border-radius:12px;\n  display:flex; align-items:center; padding:11px 13px; gap:8px;\n  transition:border-color .15s, box-shadow .15s;\n}\n.iw:focus-within{ border-color:var(--p); box-shadow:0 0 0 3px rgba(99,102,241,.12); }\n.iw input, .iw select{\n  flex:1; min-width:0; outline:none; background:transparent;\n  font-size:13px; color:var(--t); border:none; font-family:inherit;\n}\n.iw input::placeholder{ color:#94A3B8; }\n.iw.dis{ background:#F1F5F9; }\n/* Wrapper con margen para uso en C (P18b) */\n.iw.iw-c{\n  padding:10px 14px; margin:0 18px 14px;\n}\n.iw.iw-c .lb{\n  font-size:10px; font-weight:600; color:var(--mut);\n  text-transform:uppercase; letter-spacing:.05em; margin-bottom:0;\n}\n.iw.iw-c .lb small{\n  color:var(--mut2); font-weight:500; text-transform:none;\n  letter-spacing:0; margin-left:4px; font-size:10px;\n}\n.iw.iw-c input{\n  width:100%; border:0; outline:0; font-size:14px; font-weight:600;\n  padding:3px 0 0;\n}\n\n.lb{\n  font-size:11px; font-weight:600; color:#334155; margin-bottom:4px;\n  display:flex; align-items:center; gap:4px;\n}\n.lb .req{ color:var(--r); }\n.lb .opt{ color:#94A3B8; font-weight:400; font-style:italic; font-size:10px; }\n\n/* ============ BG BLOBS (onboarding A) ============ */\n.bg-blobs{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }\n.blob{\n  position:absolute; width:140px; height:140px; border-radius:24px;\n  background:linear-gradient(135deg, rgba(99,102,241,.18), rgba(59,130,246,.18));\n  filter:blur(8px); opacity:.7;\n}\n.div-txt{\n  display:flex; align-items:center; gap:10px; color:#94A3B8; font-size:11px;\n  margin:14px 0; text-transform:uppercase; letter-spacing:.06em;\n}\n.div-txt::before, .div-txt::after{\n  content:\"\"; flex:1; height:1px; background:var(--bd-light);\n}\n\n/* ============ AVATARES ============ */\n.av{\n  width:44px; height:44px; border-radius:50%;\n  display:grid; place-items:center; font-size:13px; font-weight:700;\n  flex-shrink:0; background:#E2E8F0; color:#475569;\n}\n.av.lg{ width:52px; height:52px; font-size:15px; }\n.av-jc{ background:#EEF2FF; color:#4338CA; }\n.av-mg{ background:#FCE7F3; color:#BE185D; }\n.av-jp{ background:#DBEAFE; color:#1D4ED8; }\n.av-lr{ background:#EDE9FE; color:#5B21B6; }\n.av-cs{ background:#FEF3C7; color:#92400E; }\n.av-fa{ background:#DCFCE7; color:#166534; }\n.av-gm{ background:#FFE4E6; color:#9F1239; }\n\n/* ============ CARDS ============ */\n.card{\n  background:#fff; border-radius:18px; padding:14px;\n  margin:0 18px 12px; border:1px solid var(--bds);\n  box-shadow:0 1px 2px rgba(15,23,42,.03);\n}\n.card.next{ box-shadow:0 8px 24px -14px rgba(99,102,241,.28); }\n\n/* ============ TAGS / CHIPS DE ESTADO ============ */\n.tag{\n  padding:5px 10px; border-radius:20px; font-size:11px; font-weight:700;\n  white-space:nowrap; display:inline-block;\n}\n.tag-conf{ background:#DBEAFE; color:#1D4ED8; }\n.tag-pend{ background:#FEF3C7; color:#92400E; }\n.tag-fin{ background:#EEF2FF; color:#4F46E5; }\n.tag-paid{ background:#D1FAE5; color:#047857; }\n.tag-cancel{ background:#FEE2E2; color:#B91C1C; }\n.tag-refund{ background:#F1F5F9; color:#475569; }\n.tag-active{ background:#DBEAFE; color:#1D4ED8; }\n.tag-emit{ background:#DBEAFE; color:#1D4ED8; }\n.tag-rec{ background:#D1FAE5; color:#047857; }\n.tag-adj{ background:#F1F5F9; color:#475569; }\n\n/* ============ BOTTOM NAV ============ */\n.bn{\n  background:#fff; border-top:1px solid var(--bds);\n  padding:10px 20px 22px; display:flex; justify-content:space-around;\n  flex-shrink:0;\n}\n.bni{\n  display:flex; flex-direction:column; align-items:center; gap:2px;\n  font-size:11px; font-weight:600; color:var(--mut2);\n  background:none; border:0; font-family:inherit; cursor:pointer;\n}\n.bni.act, .bni.act svg{ color:var(--p); stroke:var(--p); }\n\n/* ============ NEXT / PRÓXIMO TURNO ============ */\n.next .r1, .prow{ display:flex; gap:10px; align-items:center; }\n.next .pinfo, .pname{ flex:1; min-width:0; }\n.next .pn, .pname b{ font-weight:700; font-size:14px; display:block; }\n.next .ps, .pname i{\n  font-size:12px; color:var(--mut); font-style:normal;\n  display:block; margin-top:2px;\n}\n.dash{ border-top:1px dashed var(--bdl); margin:10px 0; }\n.next .meta, .meta{\n  display:flex; gap:8px; align-items:center; font-size:12px;\n  font-weight:600; color:#334155; margin-top:8px; flex-wrap:wrap;\n}\n.next .meta{ padding-top:10px; border-top:1px dashed var(--bdl); margin-top:10px; }\n.meta .sep{ color:#CBD5E1; }\n.meta .mode, .meta .mut{\n  display:inline-flex; align-items:center; gap:4px;\n  font-weight:500; color:var(--mut);\n}\n\n/* ============ QUICK ACTIONS ============ */\n.qa{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 18px 12px; }\n.qac{\n  background:#fff; border:1px solid var(--bds); border-radius:18px;\n  padding:18px 14px; display:flex; flex-direction:column;\n  align-items:center; gap:10px; text-align:center; cursor:pointer;\n  font-family:inherit;\n}\n.qac .ic{\n  width:44px; height:44px; border-radius:14px; background:#EEF2FF;\n  display:grid; place-items:center; color:var(--p);\n}\n.qac .ico{\n  width:44px; height:44px; border-radius:50%; background:#EFF6FF;\n  color:var(--b); display:flex; align-items:center; justify-content:center;\n}\n.qac .qt, .qac b{ font-size:13px; font-weight:700; color:#334155; }\n\n/* ============ PAY BANNER (amber) ============ */\n.paybanner{\n  background:var(--amb); border:1px solid var(--amBd); border-radius:16px;\n  padding:14px; margin:0 18px 12px;\n  display:flex; align-items:center; justify-content:space-between; gap:12px;\n}\n.paybanner .info{ flex:1; min-width:0; }\n.paybanner .tit, .paybanner b{\n  display:block; font-weight:800; font-size:13px; color:var(--amT);\n}\n.paybanner .sub, .paybanner i{\n  display:block; font-style:normal; font-size:11px;\n  color:#B45309; margin-top:2px;\n}\n.paybanner .bp, .paybanner .btn-pay{\n  background:var(--b); color:#fff; padding:10px 16px; border-radius:9999px;\n  font-size:12px; font-weight:700; border:none; cursor:pointer;\n  flex-shrink:0; font-family:inherit; white-space:nowrap;\n}\n\n.paidbanner{\n  background:#EFF6FF; border:1px solid #BFDBFE; border-radius:16px;\n  padding:12px 14px; margin:0 18px 12px;\n  display:flex; align-items:center; gap:10px;\n}\n.paidbanner .ico{\n  width:36px; height:36px; border-radius:50%; background:#DBEAFE;\n  color:var(--b); display:grid; place-items:center; flex-shrink:0;\n}\n.paidbanner .info{ flex:1; min-width:0; }\n.paidbanner b{ display:block; font-size:13px; font-weight:800; color:#1E40AF; }\n.paidbanner i{ display:block; font-style:normal; font-size:11px; color:#1E40AF; margin-top:2px; }\n.paidbanner a{\n  font-size:12px; font-weight:700; color:var(--p);\n  text-decoration:none; flex-shrink:0; cursor:pointer;\n}\n\n/* ============ EMPTY STATES ============ */\n.emcard{\n  background:#fff; border:1px dashed #CBD5E1; border-radius:14px;\n  padding:18px 14px; margin:0 18px 10px; text-align:center;\n  display:flex; flex-direction:column; align-items:center; gap:6px;\n}\n.emcard .ico{\n  width:36px; height:36px; border-radius:50%; background:#F1F5F9;\n  color:#94A3B8; display:flex; align-items:center; justify-content:center;\n}\n.emcard .tit{ font-size:12px; font-weight:700; color:#475569; }\n.emcard .desc{ font-size:11px; color:var(--mut); line-height:1.4; }\n\n.empty{\n  display:flex; flex-direction:column; align-items:center; text-align:center;\n  padding:32px 18px; background:#fff; border:1px dashed var(--bdl);\n  border-radius:18px; gap:6px; margin:24px 18px 0;\n}\n.empty .icb{\n  width:60px; height:60px; border-radius:50%; backgr der-top:1px solid #F1F5F9; line-height:1.4;\n}\n.pdf-sheet .qr{\n  display:flex; gap:8px; margin-top:6px; padding-top:6px;\n  border-top:1px dashed #CBD5E1; align-items:center;\n}\n.pdf-sheet .qri{\n  width:36px; height:36px;\n  background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 50%/5px 5px;\n  border:1px solid #0F172A; flex-shrink:0;\n}\n.pdf-sheet .qrt{ font-size:6px; color:var(--mut); line-height:1.45; }\n.pdf-ff{\n  background:#0F172A; padding:12px 14px;\n  display:flex; align-items:center; gap:10px; flex-shrink:0;\n}\n.pdf-save{\n  flex:1; background:var(--p); color:#fff; border:0; border-radius:9999px;\n  padding:13px 20px; font-weight:700; font-size:14px;\n  display:flex; align-items:center; justify-content:center; gap:8px;\n  cursor:pointer; font-family:inherit;\n}\n.pdf-cir{\n  width:44px; height:44px; border-radius:50%; background:#334155;\n  color:#fff; border:0; display:grid; place-items:center; cursor:pointer;\n  flex-shrink:0;\n}\n\n/* ============ TOAST ============ */\n.toast{\n  position:absolute; bottom:110px; left:14px; right:14px;\n  background:#0F172A; color:#fff; padding:12px 16px; border-radius:14px;\n  font-size:12px; display:flex; align-items:center; gap:10px;\n  z-index:40; box-shadow:0 12px 28px -8px rgba(0,0,0,.4);\n  animation:su .3s ease;\n}\n.toast .ok{\n  width:26px; height:26px; border-radius:50%; background:var(--g);\n  display:grid; place-items:center; color:#fff; flex-shrink:0;\n}\n\n/* ============ D · TABS / TURNOS ============ */\n.tabs{\n  display:flex; padding:0 18px;\n  border-bottom:1px solid var(--bds); flex-shrink:0;\n}\n.tab{\n  flex:1; padding:14px 10px; text-align:center;\n  font-size:14px; font-weight:700; color:var(--mut);\n  background:none; border:0; border-bottom:2px solid transparent;\n  font-family:inherit; cursor:pointer;\n}\n.tab.act{ color:var(--p); border-bottom-color:var(--p); }\n.chips-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }\n.turno-loc{\n  display:flex; align-items:center; gap:6px;\n  color:var(--mut); font-size:12px; margin-top:8px; font-weight:500;\n}\n.turno-loc svg{ color:var(--mut2); flex-shrink:0; }\n.mapbox{\n  background:#EFF6FF; border:1px solid #BFDBFE; border-radius:12px;\n  padding:12px; margin:0 18px 12px;\n  display:flex; align-items:center; gap:10px;\n}\n.mapbox .ic{\n  width:36px; height:36px; border-radius:10px; background:#fff;\n  color:var(--b); display:grid; place-items:center; flex-shrink:0;\n}\n.mapbox .info{ flex:1; min-width:0; }\n.mapbox b{ display:block; font-size:12px; font-weight:700; color:#1E40AF; }\n.mapbox i{\n  display:block; font-style:normal; font-size:11px;\n  color:#1E40AF; margin-top:2px; line-height:1.4;\n}\n.wait-note{\n  padding:10px 18px 0; font-size:11px; color:var(--mut);\n  text-align:center; background:#fff; flex-shrink:0;\n}\n.wait-note svg{ vertical-align:-2px; margin-right:4px; color:var(--mut); }\n.doc-mini{\n  display:flex; align-items:center; gap:10px; padding:10px 0;\n  border-bottom:1px solid var(--bds); cursor:pointer;\n}\n.doc-mini:last-child{ border-bottom:0; }\n.doc-mini .di{\n  width:36px; height:36px; border-radius:10px;\n  display:grid; place-items:center; flex-shrink:0;\n  background:#EEF2FF; color:var(--p);\n}\n.doc-mini .di.rec{ background:#D1FAE5; color:#047857; }\n.doc-mini .di.cer{ background:#EEF2FF; color:var(--p); }\n.doc-mini .dt{ flex:1; min-width:0; }\n.doc-mini .dt b{ display:block; font-size:13px; font-weight:700; }\n.doc-mini .dt i{\n  display:block; font-style:normal; font-size:11px;\n  color:var(--mut); margin-top:1px;\n}\n.doc-mini .arr{ color:var(--mut2); flex-shrink:0; }\n.cancel-link{\n  background:transparent; border:0; color:var(--mut);\n  font-size:12px; font-weight:500; text-decoration:underline;\n  text-underline-offset:3px; font-family:inherit; cursor:pointer;\n  padding:4px 8px; align-self:center;\n}\n.pfilter{\n  padding:8px 14px; border-radius:9999px; background:#fff;\n  color:#475569; border:1px solid var(--bdl);\n  font-size:12px; font-weight:700; white-space:nowrap;\n  font-family:inherit; cursor:pointer; transition:.15s;\n}\n.pfilter.act{ background:var(--p); color:#fff; border-color:var(--p); }\n.no-results{\n  text-align:center; padding:32px 18px; color:var(--mut); font-size:12px;\n}\n.hint{\n  background:#EEF2FF; border:1px solid #E0E7FF; border-radius:12px;\n  padding:10px 12px; margin:0 18px 12px;\n  display:flex; gap:8px; align-items:flex-start;\n  font-size:11px; color:#4338CA; line-height:1.5;\n}\n.hint svg{ flex-shrink:0; margin-top:1px; color:#4F46E5; }\n\n.hi-hero{\n  display:flex; justify-content:space-between; align-items:flex-start;\n  padding:6px 18px 4px;\n}\n.hi-hero h1{ font-size:22px; font-weight:800; }\n.hi-hero h1 span{ color:var(--b); }\n.hi-hero .sub{ font-size:11px; color:var(--mut); margin-top:2px; }\n\n/* ============ P28 · hours ============ */\n.hour{\n  padding:11px 8px; border-radius:12px; background:#fff;\n  border:1.5px solid var(--bdl); font-size:13px; font-weight:700;\n  color:#334155; font-family:inherit; cursor:pointer;\n}\n.hour.sel{\n  background:var(--p); color:#fff; border-color:var(--p);\n  box-shadow:0 6px 14px -4px rgba(99,102,241,.5);\n}\n.hour.dis{\n  background:#F1F5F9; color:var(--mut2); cursor:not-allowed; opacity:.7;\n}\n\n/* ============ P22 · pay-opt ============ */\n.pay-opt{\n  background:#fff; border:1.5px solid var(--bdl); border-radius:14px;\n  padding:12px; display:flex; align-items:center; gap:12px;\n  margin-bottom:8px; cursor:pointer; transition:.15s;\n}\n.pay-opt.sel{ border-color:var(--p); background:#F5F3FF; }\n.pay-opt .pico{\n  width:40px; height:40px; border-radius:10px;\n  background:#EEF2FF; color:var(--p);\n  display:grid; place-items:center; flex-shrink:0;\n}\n.pay-opt .pdot{\n  width:20px; height:20px; border-radius:50%;\n  border:2px solid var(--bdl); flex-shrink:0; position:relative;\n}\n.pay-opt.sel .pdot{ border-color:var(--p); }\n.pay-opt.sel .pdot::after{\n  content:\"\"; position:absolute; inset:3px; border-radius:50%; background:var(--p);\n}\n/* ============ P07 · Datos básicos (compactar sin scroll) ============ */\n[data-scr=\"prodata\"] .sb{ height:36px; }\n[data-scr=\"prodata\"] > div > div:first-child{ padding-top:4px !important; padding-bottom:0 !important; }\n[data-scr=\"prodata\"] .cb{ padding:8px 12px; margin:0 18px 6px; border-radius:12px; }\n[data-scr=\"prodata\"] .cbh{ margin-bottom:6px; }\n[data-scr=\"prodata\"] .cb > div{ margin-top:6px !important; }\n[data-scr=\"prodata\"] .cb > div:first-of-type{ margin-top:0 !important; }\n[data-scr=\"prodata\"] .lb{ margin-bottom:2px; font-size:10px; }\n[data-scr=\"prodata\"] .iw{ padding:8px 12px; border-radius:10px; }\n[data-scr=\"prodata\"] .iw input,\n[data-scr=\"prodata\"] .iw select{ font-size:12px; }\n[data-scr=\"prodata\"] .ff{ padding:10px 18px 14px; }\n[data-scr=\"prodata\"] .ff .btn{ padding:12px 20px; }\n/* Ajusta el título \"DATOS BÁSICOS\" y su subtítulo */\n[data-scr=\"prodata\"] > div > div:nth-child(2){ margin-top:2px !important; }\n[data-scr=\"prodata\"] > div > div:nth-child(2) > div:first-child{ font-size:10px; }\n[data-scr=\"prodata\"] > div > div:nth-child(2) > div:last-child{ font-size:11px; margin-top:0 !important; }\n<\/style>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\">\n<style id=\"iu-adapter\">\n/* iurumi · adaptador de módulo (lo inyecta src/build.js).\n   El marco del teléfono, el notch y el indicador de inicio los dibuja el shell:\n   acá el módulo pasa a ocupar el 100 % de la pantalla del dispositivo. */\nhtml, body {\n  margin: 0 !important; padding: 0 !important;\n  width: 100% !important; height: 100% !important; min-height: 0 !important;\n  overflow: hidden !important; display: block !important;\n  background: #F8FAFC !important;\n}\n.dev { display: none !important; }\n.phone {\n  width: 100% !important; height: 100% !important; max-width: none !important;\n  padding: 0 !important; margin: 0 !important; border-radius: 0 !important;\n  box-shadow: none !important; position: relative !important; top: auto !important; left: auto !important;\n  transform: none !important; flex-shrink: 1 !important;\n}\n.inner { border-radius: 0 !important; width: 100% !important; height: 100% !important; }\n.notch, .hi { display: none !important; }\n\n/* Nav inferior unificada del rol (la arma bridge.js dentro del contenedor de nav del módulo). */\n.iu-bn {\n  display: flex; justify-content: space-around !important; align-items: flex-start !important;\n  grid-template-columns: none !important; grid-auto-flow: column !important;\n  background: #fff !important; border-top: 1px solid #F1F5F9 !important; box-shadow: none !important;\n  height: 74px !important; min-height: 74px !important; padding: 8px 0 20px !important; gap: 0 !important;\n  flex-shrink: 0 !important;\n}\n.iu-bni {\n  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;\n  color: #94A3B8; font: 500 10.5px/1.25 'Inter', system-ui, -apple-system, sans-serif;\n  padding: 4px 0; background: none; border: 0; cursor: pointer; position: relative; margin: 0;\n}\n.iu-bni.act { color: #6366F1; font-weight: 600; }\n.iu-bni svg { width: 20px; height: 20px; flex-shrink: 0; }\n.iu-badge {\n  position: absolute; top: 0; left: calc(50% + 5px); min-width: 16px; height: 16px; border-radius: 8px;\n  background: #EF4444; color: #fff; font: 700 9.5px/16px 'Inter', system-ui, sans-serif; font-style: normal;\n  padding: 0 4px; box-sizing: border-box; text-align: center;\n}\n\n/* Sistema de diseño único: el acento es violeta en todos los módulos (pedido del 17/10).\n   Los azules de las fuentes (--b, --bd, --bl) pasan a la escala violeta. */\n:root {\n  --b: #6366F1 !important; --bd: #4F46E5 !important; --bl: #EEF2FF !important;\n}\n.bal { background: linear-gradient(145deg, #3730A3, #6366F1) !important; }\n.finblock { background: #EEF2FF !important; border-color: #E0E7FF !important; }\n.finblock .fbh { color: #4F46E5 !important; }\n.btn.b,
