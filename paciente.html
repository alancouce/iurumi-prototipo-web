=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/><\/svg>\n          <div><strong>Va a aparecer en tu lista<\/strong> recién cuando acepte. Hasta entonces no vas a ver ninguno de sus datos.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"confirm-footer\">\n        <button class=\"btn\" onclick=\"closeConfirmSheet()\">Entendido<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n\n<div class=\"toast\" id=\"toast\">\n  <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg>\n  <span id=\"toastMsg\">Listo<\/span>\n<\/div>\n<div class=\"hi\"><\/div>\n<\/div><\/div>\n<script>\nconst PACIENTES = [\n  { id:1, nombre:'María', apellido:'González', tdoc:'DNI', ndoc:'30555111',\n    edad:34, fnac:'10/06/1992', cob:{ fin:'OSDE', plan:'310', af:'12345678' },\n    prox:true, reciente:true, deuda:false, cby:false, ultAtencion:'2026-07-12',\n    avColor:'#FBCFE8', avTxt:'#831843', canTurn:true, hcAccess:'yes' },\n  { id:2, nombre:'Juan', apellido:'Pérez', tdoc:'DNI', ndoc:'28444222',\n    edad:45, fnac:'15/03/1981', cob:{ fin:'Swiss Medical', plan:'SMG30', af:'87654321' },\n    prox:false, reciente:true, deuda:true, cby:false, ultAtencion:'2026-07-15',\n    avColor:'#DBEAFE', avTxt:'#1E40AF', canTurn:true, hcAccess:'request' },\n  { id:3, nombre:'Ana', apellido:'Rodríguez', tdoc:'Pasaporte', ndoc:'AAB123456',\n    edad:28, fnac:'22/08/1998', cob:{ fin:'Galeno', plan:'Plata', af:'11223344' },\n    prox:true, reciente:false, deuda:false, cby:false, ultAtencion:'2026-05-20',\n    avColor:'#FECACA', avTxt:'#7F1D1D', canTurn:true, hcAccess:'yes' },\n  { id:4, nombre:'Carlos', apellido:'López', tdoc:'DNI', ndoc:'22333444',\n    edad:52, fnac:'03/11/1973', cob:{ fin:'OSDE', plan:'410', af:'99887766' },\n    prox:false, reciente:false, deuda:true, cby:false, ultAtencion:'2026-02-08',\n    avColor:'#BBF7D0', avTxt:'#14532D', canTurn:false, hcAccess:'off' },\n  { id:6, nombre:'Alan', apellido:'Pérez', tdoc:'DNI', ndoc:'33888999',\n    edad:38, fnac:'05/07/1987', cob:{ fin:'OSDE', plan:'210', af:'55443322' },\n    prox:false, reciente:true, deuda:true, cby:false, ultAtencion:'2026-07-01',\n    avColor:'#E9D5FF', avTxt:'#6B21A8', canTurn:true, hcAccess:'request', canWriteBlind:true },\n  { id:5, nombre:'Lucía', apellido:'Fernández', tdoc:'DNI', ndoc:'35666777',\n    edad:31, fnac:'18/09/1994', cob:{ fin:'Medifé', plan:'Bronce', af:'70112233' },\n    cel:'11 5555 8888', email:'lucia.fer@email.com',\n    prox:true, reciente:true, deuda:false, ultAtencion:'2026-06-28',\n    avColor:'#FEF3C7', avTxt:'#B45309' }\n];\n\n\n\nfunction g(s){\n  document.querySelectorAll('.s').forEach(el => el.classList.remove('active'));\n  const el = document.querySelector('[data-screen=\"' + s + '\"]');\n  if(el) el.classList.add('active');\n  const jp = document.getElementById('jp');\n  if(jp) jp.value = s;\n  if(s === 'pac-list') renderList();\n}\n\nfunction devNav(v){ g(v); }\n\nlet toastTimeout;\nfunction showToast(msg){\n  const t = document.getElementById('toast');\n  document.getElementById('toastMsg').textContent = msg;\n  t.classList.add('show');\n  clearTimeout(toastTimeout);\n  toastTimeout = setTimeout(() => t.classList.remove('show'), 2600);\n}\n\nfunction initials(nom, ape){ return ((ape[0]||'') + (nom[0]||'')).toUpperCase(); }\nfunction formatDoc(tdoc, ndoc){\n  if(tdoc === 'DNI' && /^\\d+$/.test(ndoc)){\n    return ndoc.replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.');\n  }\n  return ndoc;\n}\nfunction docLabel(tdoc){ return tdoc; }\n\n\n\n// ===== Sort =====\nlet currentSort = 'apellido';\nconst SORT_LABELS = {\n  apellido: 'Apellido (A–Z)',\n  ultAtencion: 'Última atención'\n};\n\n// ===== Listado Mis pacientes =====\nlet currentFilter = 'all';\nlet currentSearch = '';\n\nfunction renderPacCard(p){\n  const chips = [];\n  if(p.deuda) chips.push('<span class=\"pchip deuda\">Deuda<\/span>');\n  const docStr = `<strong>${docLabel(p.tdoc)}: ${formatDoc(p.tdoc, p.ndoc)}<\/strong>`;\n  const edadStr = p.edad ? ` · ${p.edad} años (${p.fnac})` : ' · Edad: —';\n  const cobLine = p.cob\n    ? `<div class=\"pat-line\">Cobertura: <strong>${p.cob.fin} ${p.cob.plan}<\/strong> · Nº: ${p.cob.af}<\/div>`\n    : `<div class=\"pat-line muted\">Sin cobertura declarada<\/div>`;\n  return `\n    <div class=\"pat-card\">\n      <div class=\"pat-avatar\" style=\"background:${p.avColor}; color:${p.avTxt};\">${initials(p.nombre, p.apellido)}<\/div>\n      <div class=\"pat-info\">\n        <div class=\"pat-name-row\">\n          <div class=\"pat-name\">${p.apellido}, ${p.nombre}<\/div>\n          ${chips.join('')}\n        <\/div>\n        <div class=\"pat-line\">${docStr}${edadStr}<\/div>\n        ${cobLine}\n      <\/div>\n      <button class=\"dots-btn\" onclick=\"openActSheet(${p.id})\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"1.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.5\"/><circle cx=\"12\" cy=\"19\" r=\"1.5\"/><\/svg>\n      <\/button>\n    <\/div>\n  `;\n}\n\nfunction renderList(){\n  const sorted = [...PACIENTES].sort((a,b) => {\n    if(currentSort === 'ultAtencion'){\n      const da = a.ultAtencion || '';\n      const db = b.ultAtencion || '';\n      if(db !== da) return db.localeCompare(da);\n    }\n    const cmp = a.apellido.localeCompare(b.apellido, 'es');\n    if(cmp !== 0) return cmp;\n    return a.nombre.localeCompare(b.nombre, 'es');\n  });\n  const list = sorted.filter(p => {\n    if(currentFilter === 'proximo' && !p.prox) return false;\n    if(currentFilter === 'recientes' && !p.reciente) return false;\n    if(currentFilter === 'deuda' && !p.deuda) return false;\n    if(currentSearch.length >= 3){\n      const q = currentSearch.toLowerCase();\n      const full = (p.apellido + ' ' + p.nombre).toLowerCase();\n      const doc = p.ndoc.toLowerCase();\n      if(!full.includes(q) && !doc.includes(q)) return false;\n    }\n    return true;\n  });\n  const cont = document.getElementById('patList');\n  document.getElementById('patCount').textContent = `${list.length} paciente${list.length !== 1 ? 's' : ''}`;\n  if(list.length === 0){\n    cont.innerHTML = `\n      <div class=\"pat-empty\" style=\"padding:40px 20px;\">\n        <div class=\"ico\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.35-4.35\"/><\/svg><\/div>\n        <h3>Sin resultados<\/h3>\n        <p>No hay pacientes tuyos que coincidan. Si todavía no se vinculó con vos, mandale tu enlace desde <strong>Agregar paciente<\/strong>.<\/p>\n      <\/div>`;\n  } else {\n    cont.innerHTML = list.map(renderPacCard).join('');\n  }\n}\n\nfunction setFilter(f){\n  currentFilter = f;\n  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('act', c.dataset.filter === f));\n  renderList();\n}\nfunction filterList(){\n  currentSearch = document.getElementById('searchInput').value.trim();\n  renderList();\n}\n\n// ===== Action sheet =====\nlet currentPatId = null;\nfunction openActSheet(id){\n  currentPatId = id;\n  const p = PACIENTES.find(x => x.id === id);\n  if(!p) return;\n  document.getElementById('actAv').textContent = initials(p.nombre, p.apellido);\n  document.getElementById('actAv').style.background = p.avColor;\n  document.getElementById('actAv').style.color = p.avTxt;\n  document.getElementById('actName').textContent = `${p.apellido}, ${p.nombre}`;\n  const chipEl = document.getElementById('actChip');\n  if(p.deuda) chipEl.outerHTML = '<span id=\"actChip\" class=\"pchip deuda\">Deuda<\/span>';\n  else chipEl.outerHTML = '<span id=\"actChip\"><\/span>';\n  const docStr = `<strong>${docLabel(p.tdoc)}: ${formatDoc(p.tdoc, p.ndoc)}<\/strong>`;\n  const edadStr = p.edad ? ` · ${p.edad} años (${p.fnac})` : ' · Edad: —';\n  document.getElementById('actDoc').innerHTML = docStr + edadStr;\n  const cobEl = document.getElementById('actCob');\n  if(p.cob){\n    cobEl.className = 'pat-line';\n    cobEl.innerHTML = `Cobertura: <strong>${p.cob.fin} ${p.cob.plan}<\/strong> · Nº: ${p.cob.af}`;\n  } else {\n    cobEl.className = 'pat-line muted';\n    cobEl.textContent = 'Sin cobertura declarada';\n  }\n  const items = [];\n  items.push(`\n    <button class=\"act-item\" onclick=\"doTurn(${p.id})\">\n      <div class=\"ic\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 2v4\"/><path d=\"M16 2v4\"/><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M3 10h18\"/><path d=\"M8 14h.01\"/><path d=\"M12 14h.01\"/><path d=\"M16 14h.01\"/><\/svg><\/div>\n      <div class=\"txt\"><div class=\"lbl\">Dar turno<\/div><div class=\"sub\">Agendar una consulta con este paciente<\/div><\/div>\n      <svg class=\"chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"/><\/svg>\n    <\/button>\n  `);\n  items.push(`\n    <button class=\"act-item\" onclick=\"doHC(${p.id})\">\n      <div class=\"ic\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/><line x1=\"9\" x2=\"15\" y1=\"13\" y2=\"13\"/><line x1=\"9\" x2=\"15\" y1=\"17\" y2=\"17\"/><\/svg><\/div>\n      <div class=\"txt\"><div class=\"lbl\">Ver historia clínica<\/div><div class=\"sub\">Acceso completo a la HC del paciente<\/div><\/div>\n      <svg class=\"chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"/><\/svg>\n    <\/button>\n  `);\n  if(p.deuda){\n    items.push(`\n      <button class=\"act-item reminder\" onclick=\"doReminder(${p.id})\">\n        <div class=\"ic\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" x2=\"12\" y1=\"8\" y2=\"12\"/><line x1=\"12\" x2=\"12.01\" y1=\"16\" y2=\"16\"/><\/svg><\/div>\n        <div class=\"txt\"><div class=\"lbl\">Enviar recordatorio de pago<\/div><div class=\"sub\">Recordarle al paciente el saldo pendiente<\/div><\/div>\n        <svg class=\"chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"/><\/svg>\n      <\/button>\n    `);\n  }\n  document.getElementById('actList').innerHTML = items.join('');\n  document.getElementById('actSheet').classList.add('open');\n}\nfunction closeActSheet(){ document.getElementById('actSheet').classList.remove('open'); }\nfunction doTurn(id){ closeActSheet(); showToast('Ir al flujo de dar turno (próximamente)'); }\nfunction doHC(id){ closeActSheet(); showToast('Ir a historia clínica (próximamente)'); }\nfunction doReminder(id){ closeActSheet(); showToast('Recordatorio de pago enviado'); }\n\n// ===== Share sheet (invitar a iurumi por WA/Email/Link) =====\nfunction copyLink(){ showToast('Enlace copiado al portapapeles'); }\nfunction openShareSheet(){ document.getElementById('shareSheet').classList.add('open'); }\nfunction closeShareSheet(){ document.getElementById('shareSheet').classList.remove('open'); }\nfunction shareVia(ch){\n  closeShareSheet();\n  if(ch === 'wa'){\n    g('pac-wa-preview');\n  } else if(ch === 'mail'){\n    g('pac-gmail-preview');\n  } else if(ch === 'link'){\n    showToast('Enlace copiado al portapapeles');\n  }\n}\n\n// PAC06 · variantes de la vista del paciente\nfunction pvSet(v){\n  const a = v === 'a';\n  document.getElementById('pvTabA').classList.toggle('act', a);\n  document.getElementById('pvTabB').classList.toggle('act', !a);\n  document.getElementById('pvA').style.display = a ? '' : 'none';\n  document.getElementById('pvB').style.display = a ? 'none' : '';\n  document.getElementById('pvLbl').textContent = a\n    ? 'Al abrir el enlace, en su app'\n    : 'Al abrir el enlace, en el navegador';\n}\n\n// ===== Confirm sheet =====\nfunction closeConfirmSheet(){ document.getElementById('confirmSheet').classList.remove('open'); }\n\n\n\n\n\nrenderList();\n<\/script>\n<script>\n/* iurumi · puente módulo ↔ shell. Lo inyecta src/build.js al final de cada módulo\n   (el build completa el id del módulo, su configuración y la función que muestra una pantalla). */\n(function () {\n  var MOD = \"vinculo\";\n  var CFG = {\"screenSel\":\".s.active\",\"screenAttr\":\"data-screen\",\"screenRoot\":\".s\",\"navSel\":null,\"navItems\":null,\"area\":null,\"areaByScreen\":null};\n  var SHOW = function (S, ARG) { g(S); };\n\n  function send(m) {\n    m.iu = 1; m.mod = MOD;\n    try { parent.postMessage(m, '*'); } catch (e) {}\n  }\n\n  var IU = window.IU = {\n    mod: MOD,\n    state: {},\n    on: {},\n    /* Navega a otro módulo (o a otra pantalla de este). */\n    go: function (mod, scr, arg) { send({ t: 'go', to: mod, scr: scr || null, arg: arg === undefined ? null : arg }); },\n    /* Vuelve a la pantalla anterior del recorrido (aunque sea de otro módulo). */\n    back: function () { send({ t: 'back' }); },\n    /* Abre el otro rol (paciente.html ↔ profesional.html) en una pantalla. */\n    rol: function (rol, mod, scr) { send({ t: 'rol', rol: rol, to: mod, scr: scr || null }); },\n    /* Estado compartido de la demo entre módulos (p. ej. turno reservado). */\n    set: function (k, v) { IU.state[k] = v; send({ t: 'set', k: k, v: v }); },\n    toast: function (msg) {\n      var fn = window.showToast || window.toast;\n      if (typeof fn === 'function') { try { fn(msg); return; } catch (e) {} }\n      send({ t: 'toast', msg: msg });\n    }\n  };\n\n  /* Pantalla activa del módulo. */\n  function cur() {\n    var el = null, list = document.querySelectorAll(CFG.screenSel || '.s.active');\n    for (var i = 0; i < list.length; i++) {\n      if (list[i].offsetParent !== null || getComputedStyle(list[i]).display !== 'none') { el = list[i]; break; }\n    }\n    if (!el) return null;\n    return el.getAttribute(CFG.screenAttr || 'data-screen') || el.id || null;\n  }\n\n  /* ¿La pantalla activa muestra la nav inferior? */\n  function navVisible() {\n    if (!CFG.navSel) return false;\n    var navs = document.querySelectorAll(CFG.navSel);\n    for (var i = 0; i < navs.length; i++) {\n      var r = navs[i].getBoundingClientRect();\n      if (r.width > 0 && r.height > 0 && getComputedStyle(navs[i]).visibility !== 'hidden') return true;\n    }\n    return false;\n  }\n\n  /* Nav inferior unificada del rol: reemplaza el contenido de las navs del módulo\n     y marca el ítem activo según la pantalla (la del contenedor o, si la nav es global, la activa). */\n  function areaFor(scr) {\n    return (CFG.areaByScreen && scr && CFG.areaByScreen[scr]) || CFG.area;\n  }\n  function renderNav() {\n    if (!CFG.navSel || !CFG.navItems) return;\n    var navs = document.querySelectorAll(CFG.navSel);\n    var now = cur();\n    for (var i = 0; i < navs.length; i++) {\n      var nav = navs[i];\n      if (!nav.getAttribute('data-iu-nav')) {\n        var html = '';\n        for (var k = 0; k < CFG.navItems.length; k++) {\n          var it = CFG.navItems[k];\n          html += '<button type=\"button\" class=\"iu-bni\" data-iu-to=\"' + it.id + '\">' +\n            it.icon + '<span>' + it.label + '<\/span>' + (it.badge ? '<i class=\"iu-badge\">' + it.badge + '<\/i>' : '') + '<\/button>';\n        }\n        nav.innerHTML = html;\n        nav.classList.add('iu-bn');\n        nav.setAttribute('data-iu-nav', '1');\n      }\n      var host = nav.closest(CFG.screenRoot || '.s');\n      var scr = host ? (host.getAttribute(CFG.screenAttr || 'data-screen') || host.id) : now;\n      var area = areaFor(scr);\n      var bs = nav.querySelectorAll('.iu-bni');\n      for (var j = 0; j < bs.length; j++) bs[j].classList.toggle('act', bs[j].getAttribute('data-iu-to') === area);\n    }\n  }\n\n  document.addEventListener('click', function (e) {\n    var b = e.target.closest && e.target.closest('[data-iu-to]');\n    if (!b) return;\n    e.preventDefault(); e.stopPropagation();\n    send({ t: 'nav', area: b.getAttribute('data-iu-to') });\n  }, true);\n\n  /* Ningún alert/confirm nativo: en el visor no se muestran. */\n  window.alert = function (m) { IU.toast(String(m)); };\n\n  var last = null;\n  function report(force) {\n    var s = cur();\n    if (s && (force || s !== last)) { last = s; send({ t: 'screen', scr: s, nav: navVisible() }); }\n  }\n\n  window.addEventListener('message', function (e) {\n    var d = e.data;\n    if (!d || !d.iu || d.from !== 'shell') return;\n    if (d.state) IU.state = d.state;\n    if (d.t === 'show') {\n      try {\n        if (d.state && typeof IU.on.state === 'function') IU.on.state(IU.state);\n        if (d.scr) SHOW(d.scr, d.arg);\n        if (d.arg !== null && d.arg !== undefined && typeof IU.on.arg === 'function') IU.on.arg(d.arg, d.scr);\n      } catch (err) { console.error('[iurumi] show', d.scr, err); }\n      renderNav();\n      report(true);\n    } else if (d.t === 'state') {\n      if (typeof IU.on.state === 'function') IU.on.state(IU.state);\n    }\n  });\n\n  var pending = 0;\n  new MutationObserver(function () {\n    clearTimeout(pending);\n    pending = setTimeout(function () { renderNav(); report(false); }, 40);\n  }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'style'] });\n\n  renderNav();\n  send({ t: 'ready', scr: cur() });\n})();\n\n<\/script>\n<script>\n/* Módulo «vinculo» del paciente: la invitación del Dr. Fuentes tal como le llega a Juana\n   (pantallas PAC04–PAC06 de Pacientes v8) + texto de consentimiento y estado de enlace vencido de la app. */\n(function () {\n  function $(s) { var e = document.querySelector(s); if (!e) console.error('[iurumi] no se encontró', s); return e; }\n  ['pac-wa-preview', 'pac-gmail-preview', 'pac-patient-view'].forEach(function (scr) {\n    var b = $('[data-screen=\"' + scr + '\"] .back, [data-screen=\"' + scr + '\"] .back-c');\n    if (b) b.setAttribute('onclick', 'IU.back()');\n  });\n  var card = $('[data-screen=\"pac-wa-preview\"] .wa-share-card');\n  if (card) { card.style.cursor = 'pointer'; card.setAttribute('onclick', \"g('pac-patient-view')\"); }\n  var link = $('[data-screen=\"pac-gmail-preview\"] .gcc-btn');\n  if (link) link.setAttribute('onclick', \"g('pac-patient-view'); return false;\");\n  var h1 = $('[data-screen=\"pac-patient-view\"] .appbar h1');\n  if (h1) h1.textContent = 'Invitación';\n  /* Consentimiento (texto acordado). */\n  var btns = $('#pvA .pv-btns');\n  if (btns) {\n    btns.innerHTML = '<button class=\"btn\" onclick=\"iuAceptar()\">Aceptar<\/button>' +\n      '<button class=\"btn-out2\" onclick=\"showToast(\\'Solicitud rechazada\\'); setTimeout(function(){ IU.go(\\'inicio\\',\\'a-home\\'); }, 900)\">Ahora no<\/button>' +\n      '<p class=\"iu-consent\">Al aceptar, este profesional va a poder ver tu historia clínica, registrar tus atenciones y darte turnos en iurumi. Podés revocar el acceso cuando quieras desde Mis profesionales.<\/p>';\n  }\n  /* La invitación es para un DNI (pedido del 16/10): se muestra el documento y el caso «otro DNI». */\n  var pvp = $('#pvA .pv-card p');\n  if (pvp) pvp.insertAdjacentHTML('afterend', '<div class=\"iu-pv-dni\">Invitación para el DNI 42.333.555<\/div>');\n  var wsc = $('[data-screen=\"pac-wa-preview\"] .wsc-sub');\n  if (wsc) wsc.insertAdjacentHTML('afterend', '<div class=\"wsc-sub\" style=\"font-weight:700;color:#334155\">Para el DNI 42.333.555<\/div>');\n  window.iuAceptar = function () {\n    showToast('Ya estás vinculada con el Dr. Marcos Fuentes');\n    setTimeout(function () { IU.go('identidad', 'profs'); }, 900);\n  };\n  var crear = $('#pvB .pv-btns .btn');\n  if (crear) crear.setAttribute('onclick', \"IU.go('mvp','signup')\");\n  /* Otro DNI: la cuenta que abre el enlace no es la del documento invitado. */\n  var tabs0 = $('[data-screen=\"pac-patient-view\"] .pv-tabs');\n  tabs0.insertAdjacentHTML('beforeend', '<button class=\"pv-tab\" id=\"pvTabD\" onclick=\"pvSet(\\'d\\')\">Otro DNI<\/button>');\n  $('#pvB').insertAdjacentHTML('afterend',\n    '<div id=\"pvD\" style=\"display:none;\"><div class=\"pv-card\"><div class=\"pv-av\" style=\"background:#FEE2E2;color:#991B1B;\">!<\/div>' +\n    '<h2>Esta invitación es para otra persona<\/h2><p>El Dr. Marcos Fuentes la generó para otro documento. Si creés que es un error, pedile que te la vuelva a enviar.<\/p>' +\n    '<div class=\"pv-btns\"><button class=\"btn-out2\" onclick=\"IU.go(\\'inicio\\',\\'a-home\\')\">Ir al inicio<\/button><\/div><\/div><\/div>');\n  /* Enlace vencido (estado de la app). */\n  var tabs = $('[data-screen=\"pac-patient-view\"] .pv-tabs');\n  if (tabs) {\n    tabs.insertAdjacentHTML('beforeend', '<button class=\"pv-tab\" id=\"pvTabC\" onclick=\"pvSet(\\'c\\')\">Enlace vencido<\/button>');\n    $('#pvB').insertAdjacentHTML('afterend',\n      '<div id=\"pvC\" style=\"display:none;\"><div class=\"pv-card\"><div class=\"pv-av\" style=\"background:#FEF3C7;color:#B45309;\">!<\/div>' +\n      '<h2>Este enlace ya no es válido<\/h2><p>Pedile a tu profesional que te comparta uno nuevo.<\/p>' +\n      '<div class=\"pv-btns\"><button class=\"btn-out2\" onclick=\"IU.go(\\'inicio\\',\\'a-home\\')\">Ir al inicio<\/button><\/div><\/div><\/div>');\n  }\n  var _pv = pvSet;\n  var EXTRA = { c: ['pvTabC', 'pvC', 'Al abrir un enlace viejo'], d: ['pvTabD', 'pvD', 'Si el DNI de tu cuenta no coincide'] };\n  window.pvSet = function (v) {\n    if (!EXTRA[v]) _pv(v);\n    Object.keys(EXTRA).forEach(function (k) {\n      document.getElementById(EXTRA[k][0]).classList.toggle('act', v === k);\n      document.getElementById(EXTRA[k][1]).style.display = v === k ? '' : 'none';\n    });\n    if (EXTRA[v]) {\n      document.getElementById('pvTabA').classList.remove('act'); document.getElementById('pvTabB').classList.remove('act');\n      document.getElementById('pvA').style.display = 'none'; document.getElementById('pvB').style.display = 'none';\n      document.getElementById('pvLbl').textContent = EXTRA[v][2];\n    }\n  };\n})();\n\n\n<\/script>\n<\/body>\n<\/html>\n"}},"orden":["inicio","identidad","mvp","notif","vinculo"],"recorridos":[{"titulo":"Crear la cuenta","desc":"Del primer ingreso a la home.","pasos":[{"mod":"mvp","scr":"welcome","txt":"Bienvenida"},{"mod":"mvp","scr":"signup","txt":"Crear cuenta"},{"mod":"mvp","scr":"role","txt":"Elegir rol y aceptar términos"},{"mod":"mvp","scr":"prodata","txt":"Datos básicos"},{"mod":"mvp","scr":"docs-val","txt":"Validar identidad (o hacerlo más tarde)"},{"mod":"mvp","scr":"wb","txt":"¡Bienvenida!"},{"mod":"inicio","scr":"a-home","txt":"Home"}]},{"titulo":"Te invita tu médico","desc":"El Dr. Fuentes te comparte su enlace.","pasos":[{"mod":"vinculo","scr":"pac-wa-preview","txt":"Llega el mensaje por WhatsApp"},{"mod":"vinculo","scr":"pac-patient-view","txt":"Abrís el enlace y aceptás"},{"mod":"identidad","scr":"profs","txt":"Queda en Mis profesionales"}]},{"titulo":"Tu consulta de hoy, por video","desc":"Del turno al pago, con el Dr. Fuentes.","pasos":[{"mod":"inicio","scr":"a-home","txt":"Tu próximo turno, en la home"},{"mod":"inicio","scr":"a-tdet","arg":{"tdet":"t2"},"txt":"Detalle del turno"},{"mod":"mvp","scr":"p19","txt":"Sala de espera"},{"mod":"mvp","scr":"p20","txt":"Consulta finalizada"},{"mod":"inicio","scr":"a-atencion","arg":{"cierre":"t2"},"txt":"Resumen con el cobro"},{"mod":"inicio","scr":"a-fin","txt":"Finanzas de salud"}]},{"titulo":"Sacar un turno","desc":"Con un profesional con el que ya estás vinculada.","pasos":[{"mod":"inicio","scr":"a-tn","txt":"Elegir profesional"},{"mod":"inicio","scr":"a-ts","arg":{"bk":"mf"},"txt":"Día y horario"},{"mod":"inicio","scr":"a-turnos","txt":"Mis turnos"}]},{"titulo":"Pagar lo pendiente","desc":"Una consulta de la Dra. García, por Mercado Pago.","pasos":[{"mod":"inicio","scr":"a-fin","txt":"Finanzas de salud"},{"mod":"inicio","scr":"a-cargo","arg":{"aIds":["c7"],"aBack":"a-fin"},"txt":"Detalle del cobro"},{"mod":"inicio","scr":"a-mp","arg":{"aIds":["c7"],"aBack":"a-cargo","payFrom":"a-cargo","mpMedio":"saldo"},"txt":"Checkout de Mercado Pago"}]},{"titulo":"Gestionar a un menor","desc":"Sumar a Mora como menor a cargo.","pasos":[{"mod":"identidad","scr":"menores","txt":"Menores a mi cargo"},{"mod":"identidad","scr":"add","txt":"Datos del menor"},{"mod":"identidad","scr":"adddoc","txt":"Documento"},{"mod":"identidad","scr":"adddone","txt":"Perfil creado"}]},{"titulo":"Mis documentos","desc":"Ver una receta y mandarla a la farmacia.","pasos":[{"mod":"mvp","scr":"p14","txt":"Documentos"},{"mod":"mvp","scr":"p16-receta","txt":"Receta"},{"mod":"mvp","scr":"pdf","txt":"Vista del PDF"},{"mod":"mvp","scr":"wa","txt":"Envío por WhatsApp"}]},{"titulo":"Perfil y cobertura","pasos":[{"mod":"inicio","scr":"a-perfil","txt":"Perfil"},{"mod":"mvp","scr":"perfil-osde","txt":"Datos personales"},{"mod":"mvp","scr":"cov-osde","txt":"Mi cobertura"},{"mod":"notif","scr":"notif-prefs","txt":"Notificaciones"}]}],"inicio":{"mod":"inicio","scr":"a-home"}};
</script>
<script>
(function () {
  'use strict';
  var D = window.IU_DATA;
  var $ = function (id) { return document.getElementById(id); };
  var screenEl = $('screen');
  var frames = {};
  var cur = { mod: null, scr: null };
  var hist = [];
  var state = {};
  var trail = [];   /* pantallas visitadas, para marcar pasos hechos */

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------- Módulos (iframes aislados) ---------- */
  function frame(id) {
    if (frames[id]) return frames[id];
    var m = D.modulos[id];
    var el = document.createElement('iframe');
    el.title = m.nombre;
    el.setAttribute('data-mod', id);
    el.srcdoc = m.html;
    screenEl.insertBefore(el, $('toast'));
    frames[id] = { el: el, ready: false, queue: [], scr: null, visited: false };
    return frames[id];
  }
  function post(id, msg) {
    var f = frame(id);
    msg.iu = 1; msg.from = 'shell'; msg.state = state;
    if (!f.ready) { f.queue.push(msg); return; }
    f.el.contentWindow.postMessage(msg, '*');
  }
  function showFrame(id) {
    for (var k in frames) frames[k].el.classList.toggle('on', k === id);
  }

  function go(mod, scr, arg, opt) {
    opt = opt || {};
    if (!D.modulos[mod]) { toast('Esa pantalla no está en este prototipo'); return; }
    if (opt.push !== false && cur.mod && !(cur.mod === mod && cur.scr === scr)) hist.push({ mod: cur.mod, scr: cur.scr });
    if (hist.length > 60) hist.shift();
    var f = frame(mod);
    var target = scr || (f.visited ? null : D.modulos[mod].inicio);
    showFrame(mod);
    cur.mod = mod;
    cur.scr = target || f.scr || D.modulos[mod].inicio;
    f.visited = true;
    post(mod, { t: 'show', scr: target, arg: arg === undefined ? null : arg });
    sync();
  }
  function back() {
    var p = hist.pop();
    if (p) go(p.mod, p.scr, null, { push: false });
  }
  function navTo(area) {
    var it = null;
    for (var i = 0; i < D.nav.length; i++) if (D.nav[i].id === area) it = D.nav[i];
    if (!it) return;
    if (it.disponible === false) { toast(it.aviso || 'Próximamente'); return; }
    hist = [];
    go(it.mod, it.scr, null, { push: false });
  }
  function broadcast() {
    for (var k in frames) if (frames[k].ready) post(k, { t: 'state' });
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.iu || d.from === 'shell') return;
    var id = null;
    for (var k in frames) if (frames[k].el.contentWindow === e.source) id = k;
    if (!id) return;
    var f = frames[id];
    switch (d.t) {
      case 'ready':
        f.ready = true;
        if (d.scr && !f.scr) f.scr = d.scr;
        f.queue.splice(0).forEach(function (m) { f.el.contentWindow.postMessage(m, '*'); });
        $('loading').hidden = true;
        break;
      case 'screen':
        f.scr = d.scr;
        if (id === cur.mod) { cur.scr = d.scr; sync(); }
        break;
      case 'go': go(d.to || id, d.scr, d.arg); break;
      case 'back': back(); break;
      case 'nav': navTo(d.area); break;
      case 'set': state[d.k] = d.v; broadcast(); break;
      case 'toast': toast(d.msg); break;
      case 'rol':
        if (d.rol === 'paciente' || d.rol === 'profesional') {
          location.href = d.rol + '.html' + (d.to ? '#' + d.to + (d.scr ? '~' + d.scr : '') : '');
        }
        break;
    }
  });

  var tt = 0;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ---------- Panel ---------- */
  function scrInfo(mod, scr) {
    var m = D.modulos[mod]; if (!m) return null;
    for (var i = 0; i < m.pantallas.length; i++) if (m.pantallas[i].id === scr) return m.pantallas[i];
    return null;
  }
  function renderOrigin() {
    var m = D.modulos[cur.mod]; if (!m) return;
    var s = scrInfo(cur.mod, cur.scr) || { id: cur.scr, label: cur.scr };
    var chips = '<span class="chip">' + esc(m.bloque) + '</span>';
    var html = '<div class="origin-mod">' + esc(m.nombre) + '</div>' +
      '<div class="origin-scr">' + esc(s.label) + '<span class="origin-id">' + esc(s.id) + '</span></div>' +
      '<dl><dt>Bloque</dt><dd>' + chips + '</dd><dt>Fuente</dt><dd>' + esc(m.fuente) + '</dd>' +
      '</dl>';
    var note = s.nota || m.nota;
    if (note) html += '<div class="note">' + esc(note) + '</div>';
    $('origin').innerHTML = html;
  }
  function renderCatalog() {
    var q = ($('q').value || '').trim().toLowerCase();
    var html = '';
    D.orden.forEach(function (id) {
      var m = D.modulos[id];
      var items = m.pantallas.filter(function (p) {
        return !q || (p.label + ' ' + p.id + ' ' + m.nombre).toLowerCase().indexOf(q) >= 0;
      });
      if (!items.length) return;
      var open = q || id === cur.mod;
      html += '<details class="cat-g"' + (open ? ' open' : '') + '><summary><span class="chip">' + esc(m.bloque) + '</span><span class="t">' + esc(m.nombre) + '</span><span class="n">' + items.length + '</span></summary><ul>';
      items.forEach(function (p) {
        var on = id === cur.mod && p.id === cur.scr;
        html += '<li><button type="button" class="' + (on ? 'on' : '') + '" data-go="' + esc(id) + '~' + esc(p.id) + '"><span class="sid">' + esc(p.id) + '</span><span>' + esc(p.label) + '</span></button></li>';
      });
      html += '</ul></details>';
    });
    $('cat').innerHTML = html || '<p style="color:var(--muted);font-size:13px">Ninguna pantalla coincide.</p>';
  }
  function renderJourneys() {
    var html = '';
    D.recorridos.forEach(function (r, ri) {
      var abierto = r.pasos.some(function (p) { return p.mod === cur.mod && p.scr === cur.scr; });
      html += '<details class="jr"' + (abierto ? ' open' : '') + '><summary>' + esc(r.titulo) + '<span class="jr-n">' + r.pasos.length + '</span></summary>' +
        (r.desc ? '<div class="jr-d">' + esc(r.desc) + '</div>' : '') + '<ol>';
      r.pasos.forEach(function (p, pi) {
        var on = p.mod === cur.mod && p.scr === cur.scr;
        var done = !on && trail.indexOf(p.mod + '~' + p.scr) >= 0;
        html += '<li><button type="button" class="' + (on ? 'on' : done ? 'done' : '') + '" data-step="' + ri + '.' + pi + '">' + esc(p.txt) + '</button></li>';
      });
      html += '</ol></details>';
    });
    $('jrL').innerHTML = html; $('jrR').innerHTML = html;
  }
  function sync() {
    if (!cur.mod) return;
    var key = cur.mod + '~' + cur.scr;
    if (trail[trail.length - 1] !== key) trail.push(key);
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
    renderOrigin(); renderCatalog(); renderJourneys();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b) { var p = b.getAttribute('data-go').split('~'); hist = []; go(p[0], p[1], null, { push: false }); closePanel(); return; }
    var s = e.target.closest('[data-step]');
    if (s) {
      var ix = s.getAttribute('data-step').split('.');
      var st = D.recorridos[+ix[0]].pasos[+ix[1]];
      go(st.mod, st.scr, st.arg); closePanel();
    }
  });
  $('q').addEventListener('input', renderCatalog);

  /* Paneles ocultables (se recuerda cuáles dejaste abiertos). En celular, el panel se cierra al elegir. */
  var movil = function () { return window.innerWidth <= 700; };
  function setPanel(k, on) {
    $('rail' + k).classList.toggle('open', on);
    $('tg' + k).setAttribute('aria-expanded', on ? 'true' : 'false');
    if (k === 'R') $('fabPanel').setAttribute('aria-expanded', on ? 'true' : 'false');
    if (!movil()) try { localStorage.setItem('iu-panel-' + k, on ? '1' : '0'); } catch (e) {}
  }
  function closePanel() { if (movil()) setPanel('R', false); }
  ['L', 'R'].forEach(function (k) {
    $('tg' + k).addEventListener('click', function () { setPanel(k, !$('rail' + k).classList.contains('open')); });
    var v = null; try { v = localStorage.getItem('iu-panel-' + k); } catch (e) {}
    if (!movil()) setPanel(k, v === '1');
  });
  document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { setPanel(b.getAttribute('data-close'), false); }); });
  $('fabPanel').addEventListener('click', function () { setPanel('R', !$('railR').classList.contains('open')); });
  /* Modo foco: oculta barra y paneles; «Mostrar menús» (o la tecla H) los vuelve a traer. */
  function setBar(on) {
    document.body.classList.toggle('nobar', !on); $('unhide').hidden = on;
    if (!on) { setPanel('L', false); setPanel('R', false); }
    try { localStorage.setItem('iu-bar', on ? '1' : '0'); } catch (e) {}
    fit();
  }
  $('hideBar').addEventListener('click', function () { setBar(false); });
  $('unhide').addEventListener('click', function () { setBar(true); });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'h' || e.key === 'H') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) setBar(document.body.classList.contains('nobar'));
  });

  /* El dispositivo se achica si la ventana es más baja que el teléfono. */
  function fit() {
    var w = $('deviceWrap');
    if (window.innerWidth <= 700) { w.style.transform = ''; w.style.marginBottom = ''; return; }
    var st = $('stage');
    var k = Math.min(1, (window.innerHeight - (document.body.classList.contains('nobar') ? 0 : 52) - 20) / 844, (st.clientWidth - 24) / 390);
    w.style.transform = 'scale(' + k + ')';
    w.style.marginBottom = (844 * k - 844) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  try { if (localStorage.getItem('iu-bar') === '0' && !movil()) setBar(false); } catch (e) {}

  /* Arranque: deep link #modulo~pantalla o pantalla inicial del rol. */
  /* También #r3: arranca el recorrido 3 (lo usan los enlaces de la portada). */
  var h = (location.hash || '').replace(/^#/, '').split('~');
  var rj = /^r(\d+)$/.exec(h[0]), r0 = rj && D.recorridos[+rj[1]] && D.recorridos[+rj[1]].pasos[0];
  if (r0) go(r0.mod, r0.scr, r0.arg, { push: false });
  else if (h[0] && D.modulos[h[0]]) go(h[0], h[1] || null, null, { push: false });
  else go(D.inicio.mod, D.inicio.scr, null, { push: false });
  window.IU_SHELL = { go: go, back: back, frames: frames, cur: cur, state: state };
})();
</script>
